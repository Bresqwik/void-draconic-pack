<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Erzverarbeitung 3D</title>
<style>
:root{
  --bg:#0c0f15;--panel:#141922;--panel2:#1b2230;--panel3:#232c3d;--line:#2b3547;
  --text:#e7ecf3;--muted:#8a96a8;--dim:#5d6878;
  --c1:#f5a524;--c2:#2dd4e8;--c3:#f4566e;--c4:#5ee38a;--laser:#ff3d6a;--sel:#ffd84d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:12px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;flex:none}
.titlebox{display:flex;align-items:center;gap:12px;min-width:0}
.back{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);text-decoration:none;font-size:16px;flex:none}
.back:hover{background:var(--panel3)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{color:var(--muted);font-size:12px}
.controls{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.grow{flex:1}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{background:none;border:0;color:var(--muted);padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none;white-space:nowrap}
.chk input{accent-color:var(--c2);width:16px;height:16px}
main{display:flex;flex:1;min-height:0;position:relative}
#view{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none}
#view canvas{display:block}
aside{width:390px;max-width:100%;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;flex:none}
#sideBody{overflow:auto;padding:14px;flex:1;-webkit-overflow-scrolling:touch}
#handle{display:none}
@media (max-width:1100px){aside{width:330px}#help{display:none}#feed{width:260px}}
/* Handy: Seitenleiste wird zum Bottom-Sheet */
@media (max-width:760px){
  header{padding:8px 12px;gap:8px}
  header .sub{display:none}
  header h1{font-size:15px}
  .controls{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:12px;padding-bottom:2px}
  .controls::-webkit-scrollbar{display:none}
  .seg button{padding:7px 10px;font-size:12px}
  aside{position:absolute;left:0;right:0;bottom:0;width:auto;height:min(72%,560px);border-left:0;border-top:1px solid var(--line);
        border-radius:16px 16px 0 0;box-shadow:0 -10px 30px #0008;transform:translateY(calc(100% - 52px));transition:transform .28s ease;z-index:5}
  aside.open{transform:none}
  #handle{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border:0;background:none;color:var(--text);font:600 14px system-ui,sans-serif;width:100%;cursor:pointer;flex:none;text-align:left}
  #handle .grip{position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
  #handle .chev{margin-left:auto;color:var(--muted);transition:transform .28s}
  aside.open #handle .chev{transform:rotate(180deg)}
  #sideBody{padding-top:0}
  #help{display:none}
  #legend{top:8px;left:8px;padding:6px 8px;font-size:11px}
  .lg{padding:2px 4px}
  #feed{left:8px;right:8px;width:auto;bottom:62px;padding:6px 10px}
  #feed h3{display:none}
  #feed li:nth-child(n+3){display:none}
  .chip code{display:none}
  .sides button{width:38px;height:32px}
  .lio,.mek{font-size:11px}
}
@media (max-width:760px) and (max-height:500px){aside{height:85%}#legend{display:none}}
#tip{position:fixed;pointer-events:none;background:#0b0e14ee;border:1px solid var(--line);padding:5px 8px;border-radius:6px;font-size:12px;display:none;z-index:9;white-space:nowrap}
#tip b{font-weight:600}
.overlay{position:absolute;background:#10141cd9;border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(4px)}
#feed{left:12px;bottom:12px;width:300px;font-size:12px}
#feed h3,#help h3{margin:0 0 6px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
#feed ul{list-style:none;margin:0;padding:0}
#feed li{display:flex;align-items:center;gap:8px;padding:2px 0;animation:fin .35s ease}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
#help{right:12px;top:12px;font-size:12px;color:var(--muted)}
#help kbd{background:var(--panel3);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:11px ui-monospace,monospace;color:var(--text)}
#legend{left:12px;top:12px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.lg{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 6px;border-radius:6px}
.lg:hover,.lg.on{background:var(--panel3)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
h2{font-size:15px;margin:2px 0 4px}
h4{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;font-weight:600}
.muted{color:var(--muted)}
.coord{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.catcard{cursor:pointer;border-left:4px solid var(--cc);transition:background .15s}
.catcard:hover,.catcard.on{background:var(--panel3)}
.catcard .t{font-weight:600;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel3);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px;font-size:12px}
.chip code{font:11px ui-monospace,Consolas,monospace;color:var(--muted)}
.ico{width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;font:700 9px ui-monospace,monospace;color:#0b0e14;flex:none;box-shadow:inset 0 -2px 0 #0003,inset 0 1px 0 #fff4}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.red{color:#ff8fa3;border-color:#5a2433;background:#2a1219}
.badge.green{color:#8ff0b0;border-color:#1f4a31;background:#10241a}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin:4px 0}
/* Laser IO GUI */
.lio{background:#c6c6c6;border-radius:6px;padding:10px;color:#3f3f3f;box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #555;font:12px ui-monospace,Consolas,monospace}
.lio .ttl{font-weight:700;margin-bottom:8px;color:#404040}
.sides{display:flex;gap:4px;margin-bottom:8px}
.sides button{width:30px;height:24px;border:0;cursor:pointer;font:700 12px ui-monospace,monospace;background:#8b8b8b;color:#fff;box-shadow:inset 2px 2px 0 #aaa,inset -2px -2px 0 #444;position:relative}
.sides button.on{background:#5b8cff;box-shadow:inset 2px 2px 0 #9bb8ff,inset -2px -2px 0 #2a4ea8}
.sides button.has::after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;background:#ffd84d;border-radius:1px}
.slots{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:2px;margin-bottom:6px}
.slot{aspect-ratio:1;background:#8b8b8b;box-shadow:inset 2px 2px 0 #373737,inset -2px -2px 0 #fff;display:grid;place-items:center;cursor:default;position:relative}
.slot.card{cursor:pointer}
.slot.card.sel{outline:2px solid #ffd84d;outline-offset:-2px}
.cardicon{width:78%;height:78%;border-radius:2px;display:grid;place-items:center;font:700 9px ui-monospace,monospace;color:#fff;box-shadow:inset 0 -2px 0 #0004,inset 0 2px 0 #fff5}
.lio .face{color:#404040;margin:4px 0 8px}
.cfg{background:#d8d8d8;box-shadow:inset 1px 1px 0 #888,inset -1px -1px 0 #fff;padding:8px;margin-top:6px}
.cfg table{width:100%;border-collapse:collapse}
.cfg td{padding:2px 0}
.cfg td:last-child{text-align:right;font-weight:700}
.btnrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mcbtn{background:#8b8b8b;color:#fff;border:0;padding:3px 7px;font:11px ui-monospace,monospace;box-shadow:inset 2px 2px 0 #aaa,inset -2px -2px 0 #444}
.mcbtn.on{background:#3a9b4a;box-shadow:inset 2px 2px 0 #7fd18c,inset -2px -2px 0 #1d5a27}
.ftags{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.ftag{background:#8b8b8b;color:#fff;padding:3px 6px;display:flex;justify-content:space-between;gap:6px;box-shadow:inset 1px 1px 0 #aaa,inset -1px -1px 0 #555}
.ftag span:last-child{color:#e9e9e9;opacity:.85}
/* Mekanism GUI */
.mek{background:#2f343b;border-radius:6px;padding:10px;border:2px solid #4a5260;box-shadow:inset 0 0 0 1px #1d2026;font:12px ui-monospace,Consolas,monospace}
.mek .ttl{font-weight:700;margin-bottom:8px;color:#cfd6e0;display:flex;justify-content:space-between}
.mekgrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}
.mslot{aspect-ratio:1;background:#1a1d22;border:1px solid #4a5260;display:grid;place-items:center;position:relative}
.mslot .n{position:absolute;right:1px;bottom:0;font-size:9px;color:#fff;text-shadow:1px 1px 0 #000}
.prog{height:6px;background:#1a1d22;border:1px solid #4a5260;margin:3px 0 8px;overflow:hidden}
.prog i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#5ee38a,#2dd4e8);animation:pr 1.6s linear infinite}
@keyframes pr{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.ebar{display:flex;align-items:center;gap:8px;margin-top:8px;color:#cfd6e0}
.ebar div{flex:1;height:8px;background:#1a1d22;border:1px solid #4a5260}
.ebar div i{display:block;height:100%;background:linear-gradient(90deg,#b31f1f,#ff5a5a)}
table.rec{width:100%;border-collapse:collapse;font-size:12px}
table.rec td{padding:3px 0;border-bottom:1px solid var(--line)}
table.rec td:last-child{text-align:right;color:var(--muted)}
button.link{background:none;border:0;color:var(--c2);cursor:pointer;padding:0;font:inherit}
</style>

pathFor.c1.unshift(cv([-137,130,109])); pathFor.c2.unshift(cv([-137,130,109])); pathFor.c3.unshift(cv([-137,130,109]));
const outPath = {
  c1:[cv([-137,130,105]),cv([-137,129,105]),cv([-137,128,105]),new THREE.Vector3(-136.5,128.5,100.2)],
  c2:[cv([-140,130,105]),cv([-140,129,105]),cv([-140,128,105]),new THREE.Vector3(-139.5,128.5,100.2)],
  c3:[cv([-134,130,105]),cv([-134,129,105]),cv([-134,128,105]),new THREE.Vector3(-133.5,128.5,100.2)],
};
function spawn(path,color,speed,onEnd,big=false){
  const m=new THREE.Mesh(big?new THREE.BoxGeometry(.2,.2,.2):PGEO,new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.9}));
  const segs=[];let tot=0;for(let i=1;i<path.length;i++){const l=path[i].distanceTo(path[i-1]);segs.push(l);tot+=l;}
  m.position.copy(path[0]); scene.add(m); parts.push({m,path,segs,tot,d:0,speed,onEnd,color});
}
function stepParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.d+=p.speed*dt;
    if(p.d>=p.tot){scene.remove(p.m);parts.splice(i,1);p.onEnd&&p.onEnd();continue;}
    let d=p.d,j=0;while(d>p.segs[j]){d-=p.segs[j];j++;}
    p.m.position.lerpVectors(p.path[j],p.path[j+1],d/p.segs[j]);p.m.rotation.x+=dt*3;p.m.rotation.y+=dt*2;
    p.m.material.opacity=1; const dim=S.focus&&p.cat&&p.cat!==S.focus; p.m.visible=!dim;
  }
}
const SIMTOT=SIM.reduce((a,b)=>a+b[1],0);
function pickOre(){let r=Math.random()*SIMTOT;for(const [t,w] of SIM){r-=w;if(r<=0)return t;}return SIM[0][0];}
let spawnT=0;
function tickSpawn(dt){
  if(!S.flow||S.view!=='neu') return;
  spawnT-=dt; if(spawnT>0) return; spawnT=.55;
  const t=pickOre(), c=catOf(t), col=ITEMS[t][1];
  spawn(pathFor[c],col,3.2,()=>{ if(outPath[c]) spawn(outPath[c],'#ffffff',2.4,null,false); });
  parts[parts.length-1].cat=c;
  feed(t,c);
}
const feedList=document.getElementById('feedList');
function feed(t,c){
  const li=document.createElement('li');
  li.innerHTML=`${ico(t)}<span>${ITEMS[t][0]}</span><span class="grow"></span><span style="color:${CATS[c].color}">→ ${c==='c4'?'Lager':'Node '+CATS[c].node}</span>`;
  feedList.prepend(li); while(feedList.children.length>6) feedList.lastChild.remove();
}
function ico(t,size=18){const [n,c]=ITEMS[t];const ab=n.replace(/[^A-Za-zÄÖÜäöü]/g,'').slice(0,2);return `<span class="ico" style="background:${c};width:${size}px;height:${size}px">${ab}</span>`;}

// ---------- Picking ----------
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), tip=document.getElementById('tip');
let down=null;
function hit(ev){const r=renderer.domElement.getBoundingClientRect();mouse.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(pickables,false)[0];return h?h.object.userData.block:null;}
renderer.domElement.addEventListener('pointermove',ev=>{if(ev.pointerType==='touch')return;const b=hit(ev);
  if(b){tip.style.display='block';tip.style.left=ev.clientX+14+'px';tip.style.top=ev.clientY+12+'px';
    tip.innerHTML=`<b>${b.node?NODES[b.node].title:NAMES[b.id]||b.id}</b> <span class="coord">${b.x} / ${b.y} / ${b.z}</span>${b.ghost?' · <span style="color:#ffd84d">neu</span>':''}${b.removed&&S.view==='ist'?' · <span style="color:#ff8fa3">wird abgebaut</span>':''}`;
    renderer.domElement.style.cursor='pointer';}
  else{tip.style.display='none';renderer.domElement.style.cursor='';}});
renderer.domElement.addEventListener('pointerleave',()=>tip.style.display='none');
renderer.domElement.addEventListener('pointerdown',ev=>down=[ev.clientX,ev.clientY]);
renderer.domElement.addEventListener('pointerup',ev=>{if(!down)return;const moved=Math.hypot(ev.clientX-down[0],ev.clientY-down[1]);down=null;if(moved>5)return;
  const b=hit(ev); select(b);});
function select(b){S.sel=b;S.selSide=null;S.selCard=0;selectionBox();renderSide();
  if(isPhone()) setSheet(!!b); }

// ---------- Seitenleiste ----------
const side=document.getElementById('sideBody'), sheet=document.getElementById('sheet'), handle=document.getElementById('handle');
const isPhone=()=>matchMedia('(max-width:760px)').matches;
function setSheet(open){sheet.classList.toggle('open',open);handle.setAttribute('aria-expanded',open);}
handle.onclick=()=>setSheet(!sheet.classList.contains('open'));
function tagChips(c){return `<div class="chips">${CATS[c].tags.map(t=>`<span class="chip">${ico(t)}${ITEMS[t][0]} <code>${t}</code></span>`).join('')}</div>`;}
function renderSide(){
  const b=S.sel;
  document.getElementById('handleTxt').textContent = b ? (b.node?NODES[b.node].title:(NAMES[b.id]||b.id)) : 'Übersicht · 4 Wege · Umbau';
  if(!b){ side.innerHTML=overview(); bindCats(); return; }
  let h=`<button class="link" id="back">← Übersicht</button>`;
  if(b.node) h+=nodeView(b);
  else if(b.id.includes('factory')) h+=factView(b);
  else h+=genericView(b);
  side.innerHTML=h;
  side.querySelector('#back').onclick=()=>select(null);
  side.querySelectorAll('[data-side]').forEach(el=>el.onclick=()=>{S.selSide=el.dataset.side;S.selCard=0;renderSide();});
  side.querySelectorAll('[data-card]').forEach(el=>el.onclick=()=>{S.selCard=+el.dataset.card;renderSide();});
  side.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{const n=NODES[el.dataset.goto];const[x,y,z]=n.pos;select({x,y,z,id:'laserio:laser_node',node:el.dataset.goto,k:K(x,y,z),ghost:S.view==='ist'});});
  bindCats();
}
function overview(){
  return `<h2>Erzverarbeitung</h2>
  <div class="muted">Void Ore Miner (Oberwelt, −959 / 1049) → Enderkiste (Frequenz Schwarz·Schwarz·Schwarz) → 4 Straßen. Klick auf einen Block für Details, auf eine Kategorie zum Hervorheben.</div>
  <h4>Die 4 Wege</h4>
  ${Object.entries(CATS).map(([k,c])=>`<div class="card catcard ${S.focus===k?'on':''}" data-cat="${k}" style="--cc:${c.color}">
     <div class="t"><span class="dot" style="background:${c.color}"></span>${c.name}<span class="grow"></span><span class="badge">${k==='c4'?'Node A · unten':'Node '+c.node}</span></div>
     <div class="muted" style="margin-top:4px">${c.what}</div>${S.focus===k?tagChips(k):''}</div>`).join('')}
  <h4>Umbau in 5 Schritten</h4>
  <ol class="steps">
    <li>Alle 6 <b>Logistical Sorter</b> und die Zulauf-Transporter abbauen <span class="badge red">rot markiert</span></li>
    <li><b>Node A</b> unter die Enderkiste (−137 / 129 / 109)</li>
    <li><b>Nodes B, C, D</b> auf die drei Factories (y 131)</li>
    <li>Mit dem <b>Laser Wrench</b> A ↔ B, A ↔ C, A ↔ D verbinden</li>
    <li>Karten einsetzen – Details per Klick auf die Nodes</li>
  </ol>
  <h4>Einkaufsliste</h4>
  <table class="rec"><tr><td>Laser Node</td><td>4×</td></tr><tr><td>Item Card</td><td>5× (1 Extract, 4 Insert)</td></tr>
  <tr><td>Tag Filter</td><td>3×</td></tr><tr><td>Overclocker Card</td><td>4× (nur Extract)</td></tr><tr><td>Laser Wrench</td><td>1×</td></tr></table>`;
}
function bindCats(){side.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>setFocus(S.focus===el.dataset.cat?null:el.dataset.cat));}
function setFocus(c){S.focus=c;build();renderSide();}

function nodeView(b){
  const d=NODES[b.node], sides=d.sides, order=['U','D','N','S','E','W'];
  const cur=S.selSide||Object.keys(sides)[0]; const sd=sides[cur];
  const cards=sd?sd.cards:[]; const card=cards[S.selCard];
  let h=`<h2>${d.title}</h2><div class="coord">${b.x} / ${b.y} / ${b.z}</div>
   <div style="margin:6px 0 10px">${S.view==='ist'?'<span class="badge" style="color:#ffd84d;border-color:#5a4a1a">noch nicht gebaut</span> ':''}<span class="muted">ersetzt ${d.replaces}</span></div>
   <div class="lio"><div class="ttl">Laser Node</div>
   <div class="sides">${order.map(s=>`<button data-side="${s}" class="${s===cur?'on':''} ${sides[s]?'has':''}">${s}</button>`).join('')}</div>
   <div class="face">Seite ${cur}: ${sd?sd.face:'leer'}</div>
   <div class="slots">${Array.from({length:9},(_,i)=>{const c=cards[i];
     if(!c) return `<div class="slot"></div>`;
     const col=c.mode==='Extract'?'#d9483b':'#3b7bd9';
     return `<div class="slot card ${i===S.selCard?'sel':''}" data-card="${i}"><div class="cardicon" style="background:${col}">${c.mode==='Extract'?'EX':'IN'}</div></div>`;}).join('')}</div>`;
  if(card){
    h+=`<div class="cfg"><table>
      <tr><td>Modus</td><td>${card.mode}</td></tr><tr><td>Kanal</td><td>${card.ch} (weiß)</td></tr>
      <tr><td>Priorität</td><td>${card.prio}</td></tr>
      ${card.mode==='Extract'?`<tr><td>Speed</td><td>${card.speed}</td></tr><tr><td>Menge</td><td>${card.amt}</td></tr><tr><td>Overclocker</td><td>${card.oc}×</td></tr>`:''}
      <tr><td>Filter</td><td>${card.filter?'Tag Filter (Allow)':'keiner'}</td></tr></table>
      <div class="btnrow">${card.mode==='Extract'?`<span class="mcbtn ${card.rr?'on':''}">Round Robin: ${card.rr?'an':'aus'}</span><span class="mcbtn">Exact: aus</span>`:''}<span class="mcbtn">Redstone: ignorieren</span></div>
      ${card.filter?`<div class="ftags">${CATS[card.filter].tags.map(t=>`<div class="ftag"><span>${t}</span><span>${ITEMS[t][0]}</span></div>`).join('')}</div>`:''}
    </div>`;
  }
  h+=`</div>`;
  if(card&&card.note) h+=`<div class="card">${card.note}</div>`;
  if(b.node==='A') h+=`<div class="card"><b>Verbindungen</b><div class="muted">Laser zu ${['B','C','D'].map(n=>`<button class="link" data-goto="${n}">Node ${n}</button>`).join(', ')}. Reichweite 8 Blöcke, Abstand hier ≈ 5.</div></div>`;
  else h+=`<div class="card"><b>Was hier ankommt</b><div class="muted">${CATS[d.cat].what}</div>${tagChips(d.cat)}<div class="muted" style="margin-top:8px">Bekommt Items von <button class="link" data-goto="A">Node A</button>.</div></div>`;
  return h;
}
function factView(b){
  const f=FACT[b.k]; const name=NAMES[b.id]; const c=f?CATS[f.cat]:null;
  const ins=c?c.tags.filter(t=>t.startsWith('forge:ores')||t.startsWith('mythic')).slice(0,9):[];
  const isSme=b.id.includes('smelting');
  let h=`<h2>${name}</h2><div class="coord">${b.x} / ${b.y} / ${b.z}</div>
    <div style="margin:6px 0 10px">${c?`<span class="badge" style="color:${c.color};border-color:${c.color}55">${f.role}</span>`:''}</div>
    <div class="mek"><div class="ttl"><span>${name}</span><span style="color:#5ee38a">Sorting: an</span></div>
    <div class="mekgrid">${Array.from({length:9},(_,i)=>{const t=(b.k===K(-137,129,105))?null:ins[i];
       return `<div class="mslot">${t?ico(t,22):''}</div>`;}).join('')}</div>
    <div class="prog"><i></i></div>
    <div class="mekgrid">${Array.from({length:9},(_,i)=>`<div class="mslot"></div>`).join('')}</div>
    <div class="ebar"><span>⚡</span><div><i style="width:${b.k===K(-137,129,105)?3:100}%"></i></div><span>${b.k===K(-137,129,105)?'2,9 kFE':'90 kFE'}</span></div></div>`;
  if(f){
    h+=`<div class="card"><b>Zulauf</b><div class="muted">${f.feed?`Von oben über <button class="link" data-goto="${f.feed}">Laser Node ${f.feed}</button>`:'Von oben aus der Enrichment Factory (Staub)'}</div>
        <b style="display:block;margin-top:8px">Ausgabe</b><div class="muted">${f.out}</div></div>
        <h4>Rezepte</h4><table class="rec">${(b.k===K(-137,129,105)?CATS.c1.tags:c.tags).map(t=>`<tr><td>${ico(t)} ${b.k===K(-137,129,105)?ITEMS[t][0].replace('erz','staub'):ITEMS[t][0]}</td><td>→ ${b.k===K(-137,130,105)?ITEMS[t][0].replace('erz','staub')+' ×2':(b.k===K(-137,129,105)?OUTNAME[t].replace(' ×2',''):OUTNAME[t])}</td></tr>`).join('')}</table>`;
    if(b.k===K(-137,129,105)) h+=`<div class="muted" style="margin-top:8px">Die Speicher-Anzeige zeigt fast leer – Factory hat gerade kaum Strom (2,9 kFE vom Server gelesen).</div>`;
  }
  return h;
}
function genericView(b){
  const name=NAMES[b.id]||b.id; let role='',extra='';
  if(b.id==='mekanism:logistical_sorter'){role=`<span class="badge red">wird ersetzt</span>`;extra=`<div class="card">Zeigt nach <b>${{north:'Norden',south:'Süden',east:'Osten',west:'Westen',up:'oben',down:'unten'}[b.p.facing]}</b>. Auf dem Server: <b>keine Filter</b>, Auto-Eject aus – bewegt also gerade nichts.${b.k===K(-137,129,109)?'<br><br>An genau dieser Stelle kommt <b>Node A</b> hin.':''}</div>`;}
  else if(b.id==='mekanism:ultimate_logistical_transporter'){
    if(FEED.has(b.k)){role=`<span class="badge red">Zulauf · wird abgebaut</span>`;extra=`<div class="card">Brachte bisher Items vom Sorter zur Factory. Übernimmt im neuen Setup der Laser.</div>`;}
    else {role=`<span class="badge green">bleibt</span>`;extra=`<div class="card">Ausgangsleitung: Produkte und Rest-Items laufen hier nach Norden Richtung Lager (Refined Storage).</div>`;}
  } else if(b.id==='enderstorage:ender_chest'){role=`<span class="badge green">Quelle</span>`;
    extra=`<div class="card"><b>Frequenz</b><div class="chips"><span class="chip"><span class="ico" style="background:#1d1d21"></span>Schwarz</span><span class="chip"><span class="ico" style="background:#1d1d21"></span>Schwarz</span><span class="chip"><span class="ico" style="background:#1d1d21"></span>Schwarz</span></div>
    <div class="muted" style="margin-top:8px">Besitzer stman476. Das Gegenstück steht am Void Ore Miner (T4 Pladium) in der Oberwelt bei −959 / 83 / 1049.</div></div>`;}
  else if(b.id.includes('cable')||b.id.includes('flux')){role=`<span class="badge green">Strom</span>`;extra=`<div class="card">Versorgt die Factories mit Energie (Flux Network).</div>`;}
  return `<h2>${name}</h2><div class="coord">${b.x} / ${b.y} / ${b.z}</div><div style="margin:6px 0">${role}</div>${extra}`;
}

// ---------- Legende & Optionen ----------
const legend=document.getElementById('legend');
function updateLegend(){
  legend.innerHTML=Object.entries(CATS).map(([k,c])=>`<div class="lg ${S.focus===k?'on':''}" data-cat="${k}"><span class="dot" style="background:${c.color}"></span>${c.name}</div>`).join('')
    +(S.view==='ist'&&S.mark?`<div class="lg" style="cursor:default"><span class="dot" style="background:#ff2b4a"></span>wird abgebaut</div><div class="lg" style="cursor:default"><span class="dot" style="border:1px dashed #ffd84d"></span>neuer Laser Node</div>`:'');
  legend.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>setFocus(S.focus===el.dataset.cat?null:el.dataset.cat));
}
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('on',x===b));
  S.view=b.dataset.v; for(const p of parts) scene.remove(p.m); parts.length=0;
  document.getElementById('feed').style.display=S.view==='neu'?'':'none';
  if(S.sel&&S.sel.node) S.sel.ghost=S.view==='ist';
  build(); renderSide();});
document.getElementById('optFlow').onchange=e=>{S.flow=e.target.checked;if(!S.flow){for(const p of parts)scene.remove(p.m);parts.length=0;}};
document.getElementById('optMark').onchange=e=>{S.mark=e.target.checked;build();};
document.getElementById('optFloor').onchange=e=>{S.floor=e.target.checked;build();};

// ---------- Loop ----------
const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  controls.update(); tickSpawn(dt); stepParts(dt);
  for(const l of lasers){l.glow.material.opacity=.16+.1*Math.sin(t*4+l.n.charCodeAt(0));}
  world.traverse(o=>{if(o.userData.spin){o.rotation.y=t*1.2;o.rotation.x=t*.7;}});
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
build(); renderSide(); resize(); loop();
</script>
</body>
</html>
