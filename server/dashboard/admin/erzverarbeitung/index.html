<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Erzverarbeitung 3D</title>
<style>
:root{--bg:#0c0f15;--panel:#141922;--panel2:#1b2230;--panel3:#232c3d;--line:#2b3547;--text:#e7ecf3;--muted:#8a96a8;--hot:#ff4d4d;--warn:#f5a524;--ok:#5ee38a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px 14px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;flex:none}
.back{display:inline-grid;place-items:center;height:34px;min-width:34px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);text-decoration:none;font-size:13px;flex:none}
header h1{font-size:15px;margin:0;white-space:nowrap}
.grow{flex:1}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{background:none;border:0;color:var(--muted);padding:6px 11px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.rulerBtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.rulerBtn.on{background:#0f3a40;border-color:#2dd4e8;color:#9fe8f2}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap}
.chk input{width:16px;height:16px;accent-color:#b07cff}
#controls{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
main{display:flex;flex:1;min-height:0;position:relative}
#view{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none}
#view canvas{display:block}
aside{width:390px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;flex:none}
#sideBody{overflow:auto;padding:14px;flex:1}
#handle{display:none}
.overlay{position:absolute;background:#10141cdd;border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(4px)}
#stepper{left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#stepper .nav{display:flex;gap:6px}
#stepper button{background:var(--panel3);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;min-width:42px}
#stepper input[type=range]{flex:1;min-width:140px;accent-color:#b07cff}
#stepTitle{font-weight:700;min-width:220px}
#stepTitle small{display:block;color:var(--muted);font-weight:400}
#legend{left:12px;top:12px;font-size:12px;display:flex;flex-direction:column;gap:3px;max-height:calc(100% - 120px);overflow:auto;max-width:260px}
#legend div{display:flex;align-items:center;gap:7px}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;pointer-events:none}
.sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid #0006;display:inline-block}
#tip{position:fixed;pointer-events:none;background:#0b0e14ee;border:1px solid var(--line);padding:5px 8px;border-radius:6px;font-size:12px;display:none;z-index:9;white-space:nowrap}
h2{font-size:16px;margin:2px 0 6px}
h4{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;font-weight:600}
.muted{color:var(--muted)}
.coord{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.hz{border-left:4px solid var(--hot);background:#24121a}
.wn{border-left:4px solid var(--warn);background:#221a10}
.okc{border-left:4px solid var(--ok);background:#10241a}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r{text-align:right;font-weight:600;white-space:nowrap;padding-left:8px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;color:#fff;white-space:nowrap}
button.link{background:none;border:0;color:#7cc7ff;cursor:pointer;padding:0;font:inherit}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini button{background:var(--panel3);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:inherit;font-size:12.5px;cursor:pointer}
@media (max-width:1100px){aside{width:330px}}
@media (max-width:760px){
  header{padding:8px 10px}
  header h1{font-size:14px}
  #controls{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  aside{position:absolute;left:0;right:0;bottom:0;width:auto;height:min(70%,560px);border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px #0008;transform:translateY(calc(100% - 50px));transition:transform .28s;z-index:6}
  aside.open{transform:none}
  #handle{display:flex;align-items:center;gap:8px;height:50px;padding:0 16px;border:0;background:none;color:var(--text);font:600 14px system-ui;width:100%;flex:none}
  #handle .chev{margin-left:auto;color:var(--muted)}
  #stepper{bottom:58px;left:8px;right:8px;padding:8px}
  #stepTitle{min-width:0;flex-basis:100%}
  #legend{display:none}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header>
  <a class="back" href="/admin/" target="_top" aria-label="Zur Übersicht">←</a>
  <h1>Erzverarbeitung · 3D</h1>
  <a class="back" href="bauanleitung.html">📘 Bauanleitung</a>
  <a class="back" href="modul-setup.html">⚙ Filter & Nodes</a>
  <div class="grow"></div>
  <div id="controls"></div>
</header>
<main>
  <div id="view">
    <div id="loading">Lade Original-Modelle …</div>
    <div id="legend" class="overlay"></div>
    <div id="stepper" class="overlay">
      <div class="nav"><button id="prev" aria-label="zurück">◀</button><button id="next" aria-label="weiter">▶</button></div>
      <div id="stepTitle"></div>
      <input type="range" id="slider" min="0" max="1" value="1" aria-label="Schritt">
    </div>
  </div>
  <aside id="sheet"><button id="handle" type="button"><span id="handleTxt">Info</span><span class="chev">▲</span></button><div id="sideBody"></div></aside>
</main>
<div id="tip"></div>
<script type="module">
import {start} from '../lib/b3d.js';
// Erzverarbeitung (Netherdach, Ist-Zustand vom Server, 15.10.2026) – Weltkoordinaten
const Y=129, ZS=[103,104,105,106,107,108];
const C1='Kanal 0 = Rohstoffe, Kanal 1 = Fertiges';
const cards=(rows)=>'<table class="t">'+rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')+'</table>';
const blocks=[];
ZS.forEach((z,i)=>{ const n=i+1;
  blocks.push({id:'S'+n,m:'smelting_factory',x:-138,y:Y,z,rot:'east',step:1,name:`Ultimate Smelting Factory S${n}`,listName:'Ultimate Smelting Factory',lab:i===0?'Smelting':'',abbr:'S'+n,
    what:'Schmilzt Erze ohne Anreicher-Rezept und jeden Staub aus den Enrichment Factories zu Barren.',upg:'8 Speed · 8 Energy · 4 Muffling',
    faces:[['w','io','item','Rückseite: Input + Output für Laser Node (Seiten-Typ „Input/Output“)'],['d','energy','energy','Strom vom Kabel darunter']]});
  blocks.push({id:'E'+n,m:'enriching_factory',x:-136,y:Y,z,rot:'west',step:1,name:`Ultimate Enriching Factory E${n}`,listName:'Ultimate Enriching Factory',lab:i===0?'Enriching':'',abbr:'E'+n,
    what:'Reichert Erze an: Metall-Erze → 2 Staub, Diamant/Redstone/Lapis/Kohle/Fluorit … direkt fertig.',upg:'8 Speed · 8 Energy · 4 Muffling',
    faces:[['e','io','item','Rückseite: Input + Output für Laser Node (Seiten-Typ „Input/Output“)'],['d','energy','energy','Strom vom Kabel darunter']]});
  blocks.push({id:'NS'+n,m:'laser_node',x:-139,y:Y,z,step:2,name:`Laser Node Smelter S${n}`,listName:'Laser Node',lab:i===0?'Node S':'',abbr:'N',
    what:'Karten auf der Ost-Seite (zur Smelting Factory):'+cards([['Insert · Kanal 0 · Prio 10','Filter „Schmelzen“: Schmelz-Erze + jeder Staub'],['Extract · Kanal 1 · 15 Ticks · 16 · 1 OC','alles Fertige → Output-Kiste']]),
    faces:[['e','io','item','2 Karten: Insert Kanal 0 (Filter Schmelzen) · Extract Kanal 1']]});
  blocks.push({id:'NE'+n,m:'laser_node',x:-135,y:Y,z,step:2,name:`Laser Node Enricher E${n}`,listName:'Laser Node',lab:i===0?'Node E':'',abbr:'N',
    what:'Karten auf der West-Seite (zur Enriching Factory):'+cards([['Insert · Kanal 0 · Prio 10','Filter „Anreichern“: alle Anreicher-Erze'],['Extract · Kanal 0 · RR · 15 Ticks · 16 · 1 OC','Filter „Staub“ → reihum an freie Smelter'],['Extract · Kanal 1 · 15 Ticks · 16 · 1 OC','Filter „Kein Staub“ (Deny) → Output-Kiste']])+'<div class="muted" style="margin-top:6px">Tipp: Bei langsamem Leeren die Extract-Karten auf 4 Overclocker, 1 Tick, 64 stellen.</div>',
    faces:[['w','io','item','3 Karten: Insert Kanal 0 · Extract Staub (RR) · Extract Rest Kanal 1']]});
});
blocks.push({id:'HUB',m:'laser_node',x:-137,y:Y,z:103,step:3,name:'Laser Node Hub (Relais)',lab:'Hub',abbr:'H',labCol:'#ff6b8a',what:'Keine Karten. Verbindet alle Nodes (13 Laser-Verbindungen), damit jede Enrichment Factory jeden Smelter erreicht.'});
blocks.push({id:'IN',m:'ender_chest',x:-137,y:128,z:110,step:3,name:'Ender-Kiste Input',lab:'Input-Kiste',labCol:'#14b8a6',abbr:'IN',
  what:'Hier landen die Erze (z. B. aus den Void Minern). Externer Input über die Ender-Frequenz.',faces:[['u','io','item','Node darüber holt die Erze heraus','Externer Input: Erze (Ender-Frequenz)']]});
blocks.push({id:'NIN',m:'laser_node',x:-137,y:Y,z:110,step:3,name:'Laser Node Input',listName:'Laser Node',lab:'Node Input',abbr:'N',
  what:'Karten auf der Unterseite (zur Input-Kiste):'+cards([['Extract · Kanal 0 · RR · 1 Tick · 64 · 4 OC','alle Erze reihum an die Factories (Filter dort)'],['Extract · Kanal 1 · 15 Ticks · 16','Filter „Lager“: Unverarbeitbares direkt in die Output-Kiste']]),
  faces:[['d','io','item','2 Extract-Karten']]});
blocks.push({id:'OUT',m:'ender_chest',x:-137,y:128,z:97,step:3,name:'Ender-Kiste Output',lab:'Output-Kiste',labCol:'#5ee38a',abbr:'OUT',
  what:'Barren, Edelsteine und alles Unverarbeitbare kommen hier an.',faces:[['u','io','item','Node darüber legt alles Fertige hinein']]});
blocks.push({id:'NOUT',m:'laser_node',x:-137,y:Y,z:97,step:3,name:'Laser Node Output',listName:'Laser Node',lab:'Node Output',abbr:'N',
  what:'Karte auf der Unterseite:'+cards([['Insert · Kanal 1','nimmt alles Fertige an']]),faces:[['d','io','item','1 Insert-Karte Kanal 1']]});
blocks.push({id:'FP',m:'flux_point',x:-137,y:128,z:108,step:0,name:'Flux Point',lab:'Flux Point',labCol:'#c084fc',abbr:'FP',what:'Netz „ZeroTwo“. Speist beide Kabelstränge (Osten und Westen).'});
for(const x of [-138,-136]) for(let z=101;z<=108;z++) blocks.push({m:'cable',x,y:128,z,step:0,name:'Ultimate Universal Cable',what:'Liegt unter den Factories auf dem Bedrock. Die Factories nehmen den Strom über ihre Unterseite.'});
const LINKS=[[[-139,129,103],[-137,129,103]],[[-139,129,103],[-135,129,103]],[[-139,129,104],[-137,129,103]],[[-139,129,104],[-135,129,104]],[[-139,129,105],[-137,129,103]],[[-139,129,105],[-135,129,105]],[[-139,129,106],[-139,129,107]],[[-139,129,106],[-137,129,103]],[[-139,129,106],[-135,129,106]],[[-139,129,107],[-135,129,107]],[[-139,129,108],[-137,129,103]],[[-139,129,108],[-137,129,110]],[[-139,129,108],[-135,129,108]],[[-137,129,97],[-137,129,103]],[[-137,129,103],[-137,129,110]],[[-137,129,103],[-135,129,103]],[[-137,129,103],[-135,129,104]],[[-137,129,103],[-135,129,105]],[[-137,129,103],[-135,129,106]],[[-137,129,103],[-135,129,107]],[[-137,129,103],[-135,129,108]],[[-137,129,110],[-135,129,108]]];
const CFG={
 worldCoords:true, spread:false, origin:[-137,129,103], background:'#14090c', fog:[40,90], shadowRange:12, exposure:1,
 center:[-137,129,103.5], cam:[-127,137,116], ground:{x0:-142,x1:-132,z0:95,z1:112,y:128,tex:'mc_bedrock'},
 steps:[
  {t:'Strom',s:'Ultimate Universal Cables unter beiden Factory-Reihen, Flux Point dazwischen'},
  {t:'Factories',s:'6 Smelting (Westen, Front nach Osten) und 6 Enriching (Osten, Front nach Westen), Rückseite zeigt nach außen'},
  {t:'Laser Nodes an den Factories',s:'Je ein Node an der Rückseite jeder Factory'},
  {t:'Kisten, Hub & Verlinken',s:'Input- und Output-Ender-Kiste mit Node darüber, Hub-Node in der Mitte, alles mit dem Laser Wrench verbinden'},
 ],
 blocks,
 extra:({THREE,S,P,group,sprite})=>{ if(S.step<3) return; const mat=new THREE.MeshBasicMaterial({color:'#ff3d6a',transparent:true,opacity:.8});
   for(const [a,b] of LINKS){ const A=P({x:a[0],y:a[1],z:a[2]}).add(new THREE.Vector3(.5,.5,.5)), Bv=P({x:b[0],y:b[1],z:b[2]}).add(new THREE.Vector3(.5,.5,.5)); const d=A.distanceTo(Bv); if(d<.01) continue;
     const m=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,d,6),mat); m.position.copy(A).lerp(Bv,.5); m.lookAt(Bv); m.rotateX(Math.PI/2); m.userData.blink=1; group.add(m); } },
 flows:[{a:'IN',b:'NIN',med:'item',col:'#c9a46a',name:'Erze'},{a:'NOUT',b:'OUT',med:'item',col:'#5ee38a',name:'Barren & Co.'}],
 overview:`<h2>So läuft die Erzverarbeitung</h2>
  <div class="card">Das ist dein <b>echter Aufbau</b>, ausgelesen vom Server: 6 Module aus je einer <b>Smelting Factory</b> (Westen) und einer <b>Enriching Factory</b> (Osten), jede mit einem Laser Node an der Rückseite. Der Node über der <b>Input-Kiste</b> verteilt die Erze reihum, der Hub verbindet alle Nodes, fertige Items landen in der <b>Output-Kiste</b>. ${C1}.</div>
  <table class="t" style="margin:6px 0 4px"><tr><td>Module</td><td class="r">6</td></tr><tr><td>Factories (Ultimate, 9 Slots)</td><td class="r">12</td></tr><tr><td>Laser Nodes</td><td class="r">15</td></tr><tr><td>Laser-Verbindungen</td><td class="r">22</td></tr></table>
  <h4>Material pro weiterem Modul</h4>
  <table class="t"><tr><td>Ultimate Enriching Factory + Ultimate Smelting Factory</td><td class="r">1 + 1</td></tr><tr><td>Laser Node</td><td class="r">2</td></tr><tr><td>Ultimate Universal Cable</td><td class="r">2</td></tr>
   <tr><td>Item Card (2 Insert, 3 Extract)</td><td class="r">5</td></tr><tr><td>Tag-Filter (Anreichern, Schmelzen, Staub, Kein Staub)</td><td class="r">4</td></tr><tr><td>Speed / Energy / Muffling Upgrade</td><td class="r">16 / 16 / 8</td></tr></table>
  <div class="muted" style="font-size:12.5px;margin-top:6px">Karten kopierst du mit dem Card Cloner von Modul 1. Neue Module setzt du einfach nach Süden (z 109+) oder Norden (z 102−) an die Reihe.</div>`,
};
// ---------- Bauplan-Seite (Bauanleitung) ----------
const L1=['forge:ores/iron','forge:ores/gold','forge:ores/copper','forge:ores/osmium','forge:ores/tin','forge:ores/lead','forge:ores/uranium'];
const L2=['forge:ores/diamond','forge:ores/emerald','forge:ores/redstone','forge:ores/lapis','forge:ores/coal','forge:ores/fluorite','forge:ores/quartz'];
const L3=['forge:ores/aluminum','forge:ores/nickel','forge:ores/silver','forge:ores/zinc','forge:ores/draconium','forge:ores/arcane_crystal','mythicbotany:alfheim_ores'];
const L4=['forge:ores/uraninite','forge:ores/dimensional_shard','forge:ores/inferium','forge:ores/prosperity','forge:ores/mithril','forge:ores/stella_arcanum','forge:ores/xpetrified_ore','forge:gems/amethyst','forge:gems/source'];
const DUST=['forge:dusts/iron','forge:dusts/gold','forge:dusts/copper','forge:dusts/osmium','forge:dusts/tin','forge:dusts/lead','forge:dusts/uranium'];
const FIL=[['Anreichern','Allow','#2dd4e8','Enricher-Node (x −135), Seite W: Insert Kanal 0, Prio 10',[...L1,...L2],6],
 ['Schmelzen','Allow','#f4566e','Smelter-Node (x −139), Seite E: Insert Kanal 0, Prio 10',[...L3,...DUST],6],
 ['Staub','Allow','#f5a524','Enricher-Node, Seite W: Extract Kanal 0, Round Robin',DUST,6],
 ['Kein Staub','Deny','#c9852a','Enricher-Node, Seite W: Extract Kanal 1',DUST,6],
 ['Lager','Allow','#5ee38a','Input-Node (über der Input-Kiste), Seite D: Extract Kanal 1',L4,1]];
const filterHtml='<div class="grid2">'+FIL.map(([n,m,c,w,tags,k])=>`<div class="card" style="border-top:4px solid ${c}"><h3>${n} <span class="chip" style="background:${m==='Deny'?'#9b2c2c':'#2f6fe0'}">${m}</span> <span class="muted" style="font-size:13px">× ${k}</span></h3><div class="muted" style="font-size:13px;margin-bottom:6px">${w}</div>${tags.map(t=>`<code style="display:inline-block;margin:2px">${t}</code>`).join('')}</div>`).join('')+'</div>'
 +'<div class="tip">Filter einrichten: Tag Filter in die Hand, Rechtsklick → Erz in den Slot legen → passenden Tag anklicken (oder eintippen) → für jeden Tag wiederholen → Allow/Deny setzen → Filter in die Item Card. Tags siehst du im Tooltip mit <b>Shift</b>.</div>'
 +'<div class="warn">„Staub“ und „Kein Staub“ müssen immer dieselben Tags haben, sonst landet Staub in der Output-Kiste.</div>';
const nodeRows=(rows)=>'<table class="t"><tr><th>Karte</th><th>Modus</th><th>Kanal</th><th>Filter</th><th>Takt</th></tr>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</table>';
const kartenHtml='<div class="grid2">'
 +`<div class="card"><h3>Smelter-Node (x −139, je Modul) · Seite E</h3>${nodeRows([['1','Insert','0 · Prio 10','Schmelzen','–'],['2','Extract','1','–','15 Ticks · 16 · 1 OC']])}</div>`
 +`<div class="card"><h3>Enricher-Node (x −135, je Modul) · Seite W</h3>${nodeRows([['1','Insert','0 · Prio 10','Anreichern','–'],['2','Extract · RR','0','Staub','15 Ticks · 16 · 1 OC'],['3','Extract','1','Kein Staub (Deny)','15 Ticks · 16 · 1 OC']])}</div>`
 +`<div class="card"><h3>Input-Node (−137 / 129 / 110) · Seite D</h3>${nodeRows([['1','Extract · RR','0','–','1 Tick · 64 · 4 OC'],['2','Extract','1','Lager','15 Ticks · 16 · 1 OC']])}</div>`
 +`<div class="card"><h3>Output-Node (−137 / 129 / 97) · Seite D</h3>${nodeRows([['1','Insert','1','–','–']])}<div class="muted" style="margin-top:8px">Hub-Node (−137 / 129 / 103): keine Karten, verbindet alle Nodes.</div></div>`
 +'</div><div class="tip">Leeren die Enricher zu langsam: an den Extract-Karten der Enricher-Nodes 4 Overclocker, 1 Tick, Menge 64. Alle Karten: Redstone ignorieren, Exact aus. Bebildert: <a href="modul-setup.html">Filter &amp; Nodes</a>.</div>';
CFG.guide={
 key:'erz', link3d:'./', planLayer:129, cell:40,
 lead:'Dein <b>echter Aufbau</b> auf dem Netherdach, ausgelesen vom Server (15.10.2026): 6 Module von z 103 bis 108. Jedes Modul ist von West nach Ost <b>Smelter-Node – Smelting Factory – frei – Enriching Factory – Enricher-Node</b> (x −139 … −135) auf y 129, darunter die Kabel auf y 128. Alle Nodes hängen per Laser am Hub; Erze kommen aus der Input-Ender-Kiste, alles Fertige landet in der Output-Ender-Kiste.',
 kpis:[['6','Module'],['12','Ultimate Factories'],['15','Laser Nodes'],['~9 Erze/s','pro Modul']],
 chainHead:'Ergebnis',
 chain:[['Input-Node','Holt alles aus der Input-Kiste und verteilt es reihum (Kanal 0)','nur an Factories mit passendem Filter'],
  ['Enriching Factory','Metall-Erze → 2 Staub; Diamant, Redstone, Lapis, Kohle, Fluorit, Quarz … direkt fertig','Staub → Smelter, Rest → Output'],
  ['Smelting Factory','Schmelz-Erze (Aluminium, Nickel, Silber, Zink, Draconium …) und jeder Staub → Barren','→ Output (Kanal 1)'],
  ['Input-Node, Karte 2','Unverarbeitbares (Liste „Lager“) direkt weiter','→ Output (Kanal 1)']],
 note:'Kanal 0 = Rohstoffe, Kanal 1 = Fertiges. Koordinaten = Weltkoordinaten im Nether.',
 materials:{
  craft:[['Ultimate Enriching Factory',6,'mit 8 Speed, 8 Energy, 4 Muffling'],['Ultimate Smelting Factory',6,'mit 8 Speed, 8 Energy, 4 Muffling'],
   ['Laser Node',15,'12 an den Factories, Input, Output, Hub'],['Item Card',33,'5 pro Modul + 2 Input + 1 Output'],['Tag Filter',25,'4 pro Modul + 1 „Lager“'],
   ['Overclocker Card',22,'3 pro Modul + 4 am Input'],['Ultimate Universal Cable',16,'2 Reihen unter den Factories'],['Flux Point',1,'zwischen den Kabelreihen'],
