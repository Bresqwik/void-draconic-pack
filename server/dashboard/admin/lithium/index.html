<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lithium-Produktion</title>
<style>
:root{
  --bg:#0c0f15;--panel:#141922;--panel2:#1b2230;--panel3:#232c3d;--line:#2b3547;
  --text:#e7ecf3;--muted:#8a96a8;
  --fuel:#7ee36b;--water:#3b9bff;--waste:#e3c13b;--power:#ff5ad1;--item:#c9a46a;
  --uo:#e8d24a;--hf:#5fd4e0;--uf6:#b07cff;--acid:#f08a3c;--laser:#ff3d6a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:#7cc7ff}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#141922f2;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.back{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);text-decoration:none;flex:none}
header h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.tag{font:700 11px ui-monospace,monospace;padding:3px 8px;border-radius:999px;background:#2a1a10;color:#ffb36b;border:1px solid #5a3a1a;white-space:nowrap}
nav.toc{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);scrollbar-width:none;position:sticky;top:55px;z-index:4}
nav.toc::-webkit-scrollbar{display:none}
nav.toc a{flex:none;text-decoration:none;color:var(--muted);font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line)}
nav.toc a:hover{color:var(--text);background:var(--panel3)}
main{max-width:1150px;margin:0 auto;padding:16px}
section{margin:20px 0 38px}
h2{font-size:21px;margin:0 0 6px}
h3{font-size:16px;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 14px;max-width:75ch}
.muted{color:var(--muted)}
code{font:12.5px ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--panel3);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px;letter-spacing:.2px}
.kpi span{font-size:12px;color:var(--muted)}
.tip{border-left:3px solid #f5a524;background:#1e1a10;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:10px;font-size:14px}
.warn{border-left:3px solid #f4566e;background:#22121a;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:10px;font-size:14px}
.ok{border-left:3px solid #5ee38a;background:#10241a;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:10px;font-size:14px}
svg{display:block;width:100%;height:auto}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid #0006}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center}
.cell{cursor:pointer}
.cell rect.b{transition:stroke .15s,stroke-width .15s}
.cell:hover rect.b,.cell.sel rect.b{stroke:#fff;stroke-width:3}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel3);margin:0 4px 4px 0}
.face{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:14px;margin-top:8px}
.face b{color:var(--muted);font-weight:600}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.step .n{width:30px;height:30px;border-radius:50%;background:#ff7a3d;color:#fff;font-weight:800;display:grid;place-items:center}
.step h3{margin:3px 0 6px}
.step ul{margin:4px 0 0;padding-left:18px}
.step.done{border-color:#1f4a31;background:linear-gradient(0deg,#10241a55,#10241a55),var(--panel)}
.check{display:flex;gap:8px;align-items:center;margin-top:8px;cursor:pointer;user-select:none;font-size:14px;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:#5ee38a}
.progress{height:8px;background:var(--panel3);border-radius:999px;overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a3d,#5ee38a);transition:width .3s}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 16px 40px}

.layers{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.layers button{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.layers button.on{background:var(--panel3);color:var(--text);border-color:#4b5a73}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;color:#fff;white-space:nowrap}
img.ic,span.ic{display:inline-block;width:28px;height:28px;border-radius:5px;image-rendering:pixelated;vertical-align:middle;border:1px solid #0008}
.big3d{display:flex;flex-direction:column;gap:2px;margin-top:14px;padding:14px 16px;border-radius:14px;text-decoration:none;color:var(--text);font-weight:800;font-size:17px;background:linear-gradient(135deg,#3b1d6e,#1b2a4a);border:1px solid #6b4bb3}
.big3d span{font-weight:400;font-size:13px;color:#c9b8ff}
.cell{cursor:pointer}.cell:hover rect.b,.cell.sel rect.b{stroke:#fff;stroke-width:3}
</style>
</head>

<script type="module">
import {guide} from '../lib/guide.js';
// Lithium-Produktion (Oberwelt, an einem Wasserplatz) – Plan-Koordinaten: x nach Osten, z nach Süden, y hoch. Ebene 1 (y 0) = Boden mit Kabeln/Pumpen.
const QE='quantum_entangloporter';
const blocks=[]; const add=o=>blocks.push(o);
// ---------- Thermal Evaporation Plant (4 × 4, oben offen) ----------
function tep(x0,z0,h,step,tag,specials){
  for(let x=x0;x<x0+4;x++) for(let z=z0;z<z0+4;z++) for(let y=0;y<h;y++){
    const wall=x===x0||x===x0+3||z===z0||z===z0+3; if(y>0&&!wall) continue;   // Innenraum hohl, oben offen
    const k=x+','+y+','+z; if(specials[k]){ add({x,y,z,step,...specials[k]}); continue; }
    add({x,y,z,m:'thermal_evaporation_block',step,hull:true,name:'Thermal Evaporation Block',what:`Wand der ${tag}. 4 × 4, innen hohl, oben offen.`});
  }
}
const HEATNOTE='Wärme kommt vom Resistive Heater über dieses Ventil. Ab 3.000 K läuft die Anlage mit voller Leistung (Code: (T − 300) × 0,4 × Höhe / 18).';
tep(12,-1,18,2,'Brine-Anlage',{
 '13,1,2':{id:'B-CTRL',m:'thermal_evaporation_controller',name:'Thermal Evaporation Controller (Brine)',lab:'Brine-TEP 18 hoch',labCol:'#e8d24a',
   what:'Steuerung der Brine-Anlage. Im GUI: Temperatur (Ziel ≥ 3.000 K) und Produktion. 18 hoch · 3.000 K → <b>1.080 mB/t Brine</b> aus 10.800 mB/t Wasser.'},
 '12,1,0':{id:'B-IN',m:'thermal_evaporation_valve',name:'Thermal Evaporation Valve (Wasser rein)',lab:'Wasser rein',labCol:'#3b9bff',what:'Nimmt das Wasser der Pumpen auf.',faces:[['w','in','fluid','Wasser von den 11 Pumpen']],noNone:1},
 '15,1,1':{id:'B-OUT',m:'thermal_evaporation_valve',name:'Thermal Evaporation Valve (Brine raus)',lab:'Brine raus',labCol:'#e8d24a',
   what:'Das Ventil gibt Brine <b>nicht von selbst</b> ab (Ausgabetank nur 10.000 mB). Das Rohr daneben mit dem Configurator auf <b>Pull</b> stellen!',faces:[['e','out','fluid','Brine → Rohr (Pull) → Lithium-Anlage']],noNone:1},
 '13,1,-1':{id:'B-HV',m:'thermal_evaporation_valve',name:'Thermal Evaporation Valve (Wärme)',what:HEATNOTE,faces:[['n','in','heat','Wärme vom Resistive Heater']],noNone:1},
});
tep(17,-1,3,3,'Lithium-Anlage',{
 '18,1,2':{id:'L-CTRL',m:'thermal_evaporation_controller',name:'Thermal Evaporation Controller (Lithium)',lab:'Lithium-TEP 3 hoch',labCol:'#ff8fd8',
   what:'Steuerung der Lithium-Anlage. 3 hoch · 3.000 K → bis 180 Vorgänge/t, gebraucht werden 108 (so viel Brine kommt an) → <b>108 mB/t Lithium</b>.'},
 '17,1,1':{id:'L-IN',m:'thermal_evaporation_valve',name:'Thermal Evaporation Valve (Brine rein)',lab:'Brine rein',labCol:'#e8d24a',what:'Nimmt die Brine aus der Brine-Anlage auf.',faces:[['w','in','fluid','Brine vom Rohr']],noNone:1},
 '20,1,1':{id:'L-OUT',m:'thermal_evaporation_valve',name:'Thermal Evaporation Valve (Lithium raus)',lab:'Lithium raus',labCol:'#ff8fd8',
   what:'Auch hier: Rohr daneben auf <b>Pull</b>, sonst ist der 10.000-mB-Ausgabetank sofort voll und alles steht.',faces:[['e','out','fluid','Lithium (flüssig) → Rohr (Pull) → Rotary']],noNone:1},
 '18,1,-1':{id:'L-HV',m:'thermal_evaporation_valve',name:'Thermal Evaporation Valve (Wärme)',what:HEATNOTE,faces:[['n','in','heat','Wärme vom Resistive Heater']],noNone:1},
});
// ---------- Heizung ----------
[[13,'B','Brine-Anlage','≥ 3.200 J/t (ca. 1.300 FE/t) – empfohlen 5.000 J/t'],[18,'L','Lithium-Anlage','≥ 600 J/t – empfohlen 1.000 J/t']].forEach(([x,t,n,e])=>{
  add({id:t+'-HEAT',x,y:1,z:-2,m:'resistive_heater',rot:'north',step:4,name:'Resistive Heater ('+n+')',listName:'Resistive Heater',lab:'Heater',labCol:'#ff7a3d',
    what:`Macht aus Strom Wärme (60 %). Im GUI die Energie einstellen: <b>${e}</b>. Hält die ${n} über 3.000 K (Gleichgewicht laut Code: Verlust 0,02 × √(T − Umgebung) × Wärmekapazität).`,
    faces:[['s','out','heat','Wärme → Ventil der '+n],['d','energy','energy','Strom vom Flux Point darunter']],noNone:1});
  add({x,y:0,z:-2,m:'flux_point',step:4,name:'Flux Point',what:'Netz „ZeroTwo“. Versorgt den Heater darüber.'});
});
// ---------- Wasser: 11 Electric Pumps über Wasserquellen ----------
for(let x=0;x<=10;x++){
  add({x,y:-1,z:0,m:'water',step:0,name:'Wasserquelle',listName:'Wasserquelle (Eimer)',what:'Ein Graben 1 tief mit Wasser. Auf dem Server ist pumpWaterSources = false – die Quellen werden nie leer.'});
  add({id:'PU'+x,x,y:0,z:0,m:'electric_pump',rot:'north',step:1,name:'Electric Pump',lab:x===5?'11 Pumpen':'',labCol:'#5aa9ff',
    what:'8 Speed-Upgrades: 1 Block Wasser (1.000 mB) pro Tick (Code: 19 Ticks × 10^−1 → 1). 11 Pumpen = 11.000 mB/t für die Brine-Anlage (braucht 10.800).',
    upg:'8 Speed (+ Energy nach Wunsch)',faces:[['u','out','fluid','Wasser → Rohr darüber (fest oben)'],['s','energy','energy','Strom über die Rückseite (Kabel)']],noNone:1});
  add({x,y:1,z:0,m:'pipe',step:1,name:'Ultimate Mechanical Pipe',what:'Sammelt das Wasser aller Pumpen und bringt es zur Brine-Anlage.'});
  add({x,y:0,z:1,m:'cable',step:0,name:'Ultimate Universal Cable',what:'Strom für die Pumpen (an ihrer Rückseite).'});
}
add({x:11,y:1,z:0,m:'pipe',step:1,name:'Ultimate Mechanical Pipe',what:'Letztes Stück zum Wasser-Ventil.'});
add({id:'FP1',x:-1,y:0,z:1,m:'flux_point',step:0,name:'Flux Point',lab:'Flux Point',labCol:'#c084fc',what:'Netz „ZeroTwo“. Versorgt die Pumpen-Kabel.'});
// ---------- Brine → Lithium → Ausgang ----------
add({x:16,y:1,z:1,m:'pipe',step:3,name:'Ultimate Mechanical Pipe (Pull)',listName:'Ultimate Mechanical Pipe',what:'<b>Mit dem Configurator auf Pull</b> (zur Brine-Anlage hin). Holt die Brine heraus und gibt sie an die Lithium-Anlage.'});
add({x:21,y:1,z:1,m:'pipe',step:5,name:'Ultimate Mechanical Pipe (Pull)',listName:'Ultimate Mechanical Pipe',what:'<b>Auf Pull</b> zur Lithium-Anlage hin. Bringt flüssiges Lithium zum Rotary Condensentrator.'});
add({id:'ROT',x:22,y:1,z:1,m:'rotary_condensentrator',rot:'south',step:5,name:'Rotary Condensentrator',lab:'Rotary',labCol:'#ff8fd8',
  what:'Modus <b>Decondensentrating</b> (Flüssigkeit → Gas): flüssiges Lithium → Lithium-Gas.',upg:'7–8 Speed: 128–256 mB/t (gebraucht 108)',
  faces:[['w','in','fluid','Lithium (flüssig) vom Rohr'],['e','out','gas','Lithium-Gas → Tank, Auto-Eject an'],['d','energy','energy','Strom vom Kabel']]});
add({id:'T',x:23,y:1,z:1,m:'chemical_tank',rot:'south',step:5,name:'Ultimate Chemical Tank (Lithium)',lab:'Lithium-Tank',labCol:'#ff8fd8',
  what:'Puffer: 8.192.000 mB Lithium = gut 1 h Produktion. Gibt nach Osten (QE) und Süden (Crystallizer) ab.',
  faces:[['w','in','gas','Lithium-Gas vom Rotary'],['e','out','gas','→ QE „Lithium“, Auto-Eject an'],['s','out','gas','→ Crystallizer, Auto-Eject an']]});
add({id:'QL',x:24,y:1,z:1,m:QE,step:5,name:'Quantum Entangloporter „Lithium“',lab:'QE Lithium',labCol:'#14b8a6',
  what:'Frequenz „Lithium“: Lithium-Gas zu deinem Tritium-Bau (Solar Neutron Activator, 1:1, max. 64 mB/t je SNA bei Tag) – für die Fusion reichen 5 mB/t.',faces:[['w','in','gas','Lithium-Gas vom Tank']]});
add({id:'CR',x:23,y:1,z:2,m:'chemical_crystallizer',rot:'south',step:5,name:'Chemical Crystallizer',lab:'Crystallizer',labCol:'#ff8fd8',
  what:'100 mB Lithium-Gas → 1 Lithium-Staub (für Induction Cells & Co.).',upg:'8 Speed',
  faces:[['n','in','gas','Lithium-Gas vom Tank'],['s','out','item','Lithium-Staub → QE „Lithium-Staub“, Auto-Eject an'],['d','energy','energy','Strom vom Kabel']]});
add({id:'QS',x:23,y:1,z:3,m:QE,step:5,name:'Quantum Entangloporter „Lithium-Staub“',lab:'QE Lithium-Staub',labCol:'#14b8a6',what:'Frequenz „Lithium-Staub“: schickt den Staub in dein Lager.',faces:[['n','in','item','Lithium-Staub vom Crystallizer']]});
add({id:'FP2',x:21,y:0,z:1,m:'flux_point',step:5,name:'Flux Point',what:'Netz „ZeroTwo“. Versorgt Rotary und Crystallizer.'});
[[22,1],[23,1],[23,2]].forEach(([x,z])=>add({x,y:0,z,m:'cable',step:5,name:'Ultimate Universal Cable',what:'Strom unter Rotary und Crystallizer (sichtbar auf dem Boden).'}));
[[24,1],[23,3]].forEach(([x,z])=>add({x,y:0,z,m:'cube:mc_stone',step:5,name:'Stützblock (beliebiger Vollblock)',what:'Hebt den Entangloporter auf Maschinenhöhe.'}));

const CFG={
 origin:[0,0,0], spread:false, center:[13,4,0.5], cam:[34,22,24], maxDist:80, shadowRange:22, ground:{x0:-2,x1:26,z0:-3,z1:4,y:0,tex:'mc_stone'},
 steps:[
  {t:'Wasser & Strom',s:'Graben 1 tief mit 11 Wasserquellen, Kabelreihe dahinter, Flux Point'},
  {t:'Pumpen + Rohr',s:'11 Electric Pumps (8 Speed) auf dem Wasser, Ultimate Mechanical Pipe oben drauf bis zum Wasser-Ventil'},
  {t:'Brine-Anlage 18 hoch',s:'4 × 4, innen hohl, oben offen: Controller (Süden), Wasser-Ventil (Westen), Brine-Ventil (Osten), Wärme-Ventil (Norden)'},
  {t:'Lithium-Anlage 3 hoch',s:'4 × 4 × 3 daneben, Rohr dazwischen auf Pull'},
  {t:'Heizung',s:'Je ein Resistive Heater auf einem Flux Point vor dem Wärme-Ventil, Energie im GUI einstellen'},
  {t:'Lithium-Ausgang',s:'Rohr (Pull), Rotary Condensentrator, Lithium-Tank, QE „Lithium“, Crystallizer, QE „Lithium-Staub“'},
  {t:'Start',s:'Heizen bis 3.000 K (dauert), Pull-Rohre prüfen, Seiten einstellen – dann läuft es von selbst'},
 ],
 blocks,
 flows:[{a:'PU10',b:'B-IN',med:'fluid',col:'#3b9bff',name:'Wasser 10.800 mB/t',ya:1.5,yb:.5},{a:'B-OUT',b:'L-IN',med:'fluid',col:'#e8d24a',name:'Brine 1.080 mB/t'},
  {a:'L-OUT',b:'ROT',med:'fluid',col:'#ff8fd8',name:'Lithium 108 mB/t'},{a:'ROT',b:'T',med:'gas',col:'#ff8fd8'},{a:'T',b:'QL',med:'gas',col:'#ff8fd8',name:'Lithium-Gas'},
  {a:'T',b:'CR',med:'gas',col:'#ff8fd8'},{a:'CR',b:'QS',med:'item',col:'#f2d4ff',name:'Lithium-Staub'},{a:'B-HEAT',b:'B-HV',med:'heat',col:'#ff7a3d',name:'Wärme'},{a:'L-HEAT',b:'L-HV',med:'heat',col:'#ff7a3d'}],
 overview:`<h2>Lithium-Produktion</h2>
  <div class="card">Wasser → <b>Brine</b> (Thermal Evaporation, 10:1) → <b>Lithium</b> (Thermal Evaporation, 10:1) → Rotary → Lithium-Gas. Ein Modul liefert <b>108 mB/t Lithium</b>. Begrenzt wird es vom Wasser: die Brine-Anlage braucht 10.800 mB/t.</div>
  <table class="t" style="margin:6px 0 4px"><tr><td>Wasser (11 Pumpen)</td><td class="r">11.000 mB/t</td></tr><tr><td>Brine (18 hoch, 3.000 K)</td><td class="r">1.080 mB/t</td></tr>
   <tr><td><b>Lithium</b></td><td class="r"><b>108 mB/t · 388.800 mB/h</b></td></tr><tr><td>reicht für Tritium</td><td class="r">20 × Fusion bei Rate 10</td></tr></table>
  <div class="card wn"><b>Häufigster Fehler:</b> Die Ventile geben nichts von selbst ab und der Ausgabetank fasst nur 10.000 mB. Ohne Rohr auf <b>Pull</b> steht die Anlage nach Sekunden.</div>`,
};
// ---------- Bauplan-Seite ----------
const AB={'B-CTRL':'C','B-IN':'W','B-OUT':'B','B-HV':'H','L-CTRL':'C','L-IN':'B','L-OUT':'Li','L-HV':'H','B-HEAT':'HT','L-HEAT':'HT',ROT:'RC',T:'T',QL:'QE',CR:'CR',QS:'QE',FP1:'FP',FP2:'FP'};
CFG.blocks.forEach(b=>{ if(AB[b.id]) b.abbr=AB[b.id]; if(b.m==='electric_pump') b.abbr='P'; });
CFG.guide={
 key:'lithium', link3d:'3d.html', planLayer:1, cell:30,
 lead:'Lithium kommt im Pack nur aus Mekanism: Wasser wird in einer <b>Thermal Evaporation Plant</b> zu Brine eingedampft, Brine in einer zweiten zu Lithium. Dieses Modul ist auf <b>maximale Produktion pro Wasser</b> ausgelegt: die Brine-Anlage 18 hoch bei 3.000 K (Maximum laut Code), die Lithium-Anlage nur so groß wie nötig. Es braucht Wasserquellen – also in der <b>Oberwelt</b> bauen (im Nether kann man kein Wasser platzieren).',
 kpis:[['108 mB/t','Lithium pro Modul'],['1.080 mB/t','Brine (Maximum einer TEP)'],['11','Pumpen à 1.000 mB/t'],['3.000 K','Ziel-Temperatur']],
 chainHead:'Menge',
 chain:[['Electric Pump × 11','Wasser aus Quellen, die nie leer werden (Server: pumpWaterSources = false), 8 Speed → 1.000 mB/t je Pumpe','11.000 mB/t Wasser'],
  ['Thermal Evaporation 18 hoch','10 mB Wasser → 1 mB Brine · Vorgänge/t = (T − 300) × 0,4 × Höhe / 18 = 1.080 bei 3.000 K','1.080 mB/t Brine'],
  ['Thermal Evaporation 3 hoch','10 mB Brine → 1 mB Lithium · bis 180 Vorgänge/t, gebraucht 108','<b>108 mB/t Lithium</b>'],
  ['Rotary Condensentrator','flüssiges Lithium → Lithium-Gas (1:1)','108 mB/t'],
  ['Weiter','Solar Neutron Activator: Lithium → Tritium (1:1, max. 64 mB/t je SNA, nur bei Tag) · Chemical Crystallizer: 100 mB → 1 Lithium-Staub','nach Bedarf']],
