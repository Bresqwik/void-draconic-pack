<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brennstoff 3D</title>
<style>
:root{--bg:#0c0f15;--panel:#141922;--panel2:#1b2230;--panel3:#232c3d;--line:#2b3547;--text:#e7ecf3;--muted:#8a96a8;--hot:#ff4d4d;--warn:#f5a524;--ok:#5ee38a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px 14px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;flex:none}
.back{display:inline-grid;place-items:center;height:34px;min-width:34px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);text-decoration:none;font-size:13px;flex:none}
header h1{font-size:15px;margin:0;white-space:nowrap}
.grow{flex:1}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{background:none;border:0;color:var(--muted);padding:6px 11px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.rulerBtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.rulerBtn.on{background:#0f3a40;border-color:#2dd4e8;color:#9fe8f2}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap}
.chk input{width:16px;height:16px;accent-color:#b07cff}
#controls{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
main{display:flex;flex:1;min-height:0;position:relative}
#view{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none}
#view canvas{display:block}
aside{width:390px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;flex:none}
#sideBody{overflow:auto;padding:14px;flex:1}
#handle{display:none}
.overlay{position:absolute;background:#10141cdd;border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(4px)}
#stepper{left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#stepper .nav{display:flex;gap:6px}
#stepper button{background:var(--panel3);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;min-width:42px}
#stepper input[type=range]{flex:1;min-width:140px;accent-color:#b07cff}
#stepTitle{font-weight:700;min-width:220px}
#stepTitle small{display:block;color:var(--muted);font-weight:400}
#legend{left:12px;top:12px;font-size:12px;display:flex;flex-direction:column;gap:3px;max-height:calc(100% - 120px);overflow:auto;max-width:260px}
#legend div{display:flex;align-items:center;gap:7px}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;pointer-events:none}
.sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid #0006;display:inline-block}
#tip{position:fixed;pointer-events:none;background:#0b0e14ee;border:1px solid var(--line);padding:5px 8px;border-radius:6px;font-size:12px;display:none;z-index:9;white-space:nowrap}
h2{font-size:16px;margin:2px 0 6px}
h4{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;font-weight:600}
.muted{color:var(--muted)}
.coord{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.hz{border-left:4px solid var(--hot);background:#24121a}
.wn{border-left:4px solid var(--warn);background:#221a10}
.okc{border-left:4px solid var(--ok);background:#10241a}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r{text-align:right;font-weight:600;white-space:nowrap;padding-left:8px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;color:#fff;white-space:nowrap}
button.link{background:none;border:0;color:#7cc7ff;cursor:pointer;padding:0;font:inherit}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini button{background:var(--panel3);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:inherit;font-size:12.5px;cursor:pointer}
@media (max-width:1100px){aside{width:330px}}
@media (max-width:760px){
  header{padding:8px 10px}
  header h1{font-size:14px}
  #controls{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  aside{position:absolute;left:0;right:0;bottom:0;width:auto;height:min(70%,560px);border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px #0008;transform:translateY(calc(100% - 50px));transition:transform .28s;z-index:6}
  aside.open{transform:none}
  #handle{display:flex;align-items:center;gap:8px;height:50px;padding:0 16px;border:0;background:none;color:var(--text);font:600 14px system-ui;width:100%;flex:none}
  #handle .chev{margin-left:auto;color:var(--muted)}
  #stepper{bottom:58px;left:8px;right:8px;padding:8px}
  #stepTitle{min-width:0;flex-basis:100%}
  #legend{display:none}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header>
  <a class="back" href="/admin/" target="_top" aria-label="Zur Übersicht">←</a>
  <h1>Fissile-Fuel-Anlage · 3D</h1>
  <a class="back" href="brennstoff.html">📘 Bauplan</a>
  <div class="grow"></div>
  <div id="controls"></div>
</header>
<main>
  <div id="view">
    <div id="loading">Lade Original-Modelle …</div>
    <div id="legend" class="overlay"></div>
    <div id="stepper" class="overlay">
      <div class="nav"><button id="prev" aria-label="zurück">◀</button><button id="next" aria-label="weiter">▶</button></div>
      <div id="stepTitle"></div>
      <input type="range" id="slider" min="0" max="1" value="1" aria-label="Schritt">
    </div>
  </div>
  <aside id="sheet"><button id="handle" type="button"><span id="handleTxt">Info</span><span class="chev">▲</span></button><div id="sideBody"></div></aside>
</main>
<div id="tip"></div>
<script type="module">
import {start} from '../lib/b3d.js';
// Fissile-Fuel-Anlage (Basis) – Plan-Koordinaten: x nach Osten, z nach Süden, y hoch
const QE='quantum_entangloporter';
const CFG={
 origin:[0,0,0], spread:true, center:[2.6,.5,1.8], cam:[10,7.5,11], ground:{x0:-2,x1:6,z0:-2,z1:4,y:0,tex:'mc_stone'},
 steps:[
  {t:'Strom-Ebene',s:'Ebene 1 auf dem Boden: Universal Cables unter den Maschinen, Stützblöcke unter Tanks und QEs, Flux Point ins Netz „ZeroTwo“'},
  {t:'Hauptreihe',s:'West → Ost: Oxidizer, Infuser, Centrifuge, Puffer-Tank, QE „Brennstoff“'},
  {t:'Nordreihe',s:'Enrichment Chamber, Dissolution Chamber, Fluid Tank (Wasser)'},
  {t:'Rohstoff-Entangloporter',s:'QE „Uran“, „Fluorit“, „Schwefel“ an die Kammern'},
  {t:'Müll-Reihe',s:'Eine Reihe Abstand, dann Müll-Tank und QE „Müll“'},
  {t:'Seiten einstellen & Start',s:'Configurator: jede farbige Fläche wie gezeigt · Upgrades rein · Testlauf mit ein paar Barren'},
 ],
 blocks:[
  {id:'E',m:'enrichment_chamber',x:0,y:0,z:0,rot:'west',step:2,name:'Enrichment Chamber',lab:'Enrichment',
   what:'1 Uran-Barren → 2 Yellow Cake Uranium',upg:'4 Speed · 63 Ticks pro Barren · reicht für 15,9 mB/t',
   faces:[['u','in','item','Uran-Barren vom QE „Uran“'],['s','out','item','Yellow Cake → Oxidizer, Auto-Eject an'],['d','energy','energy','Strom vom Kabel']]},
  {id:'D',m:'chemical_dissolution_chamber',x:1,y:0,z:0,rot:'east',step:2,name:'Chemical Dissolution Chamber',lab:'Dissolution',
   what:'1 Fluorit + 1 mB Sulfuric Acid → 1.000 mB Hydrofluoric Acid. Schwefelstaub im Extra-Slot wird zu 2 mB Sulfuric Acid.',upg:'0 Speed · 100 Ticks pro Fluorit · reicht für 20 mB/t',
   faces:[['u','in','item','Fluorit vom QE „Fluorit“'],['n','extra','item','Schwefelstaub vom QE „Schwefel“ → Extra-Slot'],['s','out','gas','Hydrofluoric Acid → Infuser, Auto-Eject an'],['d','energy','energy','Strom vom Kabel']]},
  {id:'QU',m:QE,x:0,y:1,z:0,step:3,name:'Quantum Entangloporter „Uran“',lab:'QE Uran',labCol:'#14b8a6',
   what:'Externer Input: Uran-Barren. Frequenz „Uran“ (privat) – auf der anderen Seite speist du die Barren ein.',
   faces:[['d','out','item','Uran-Barren → Enrichment Chamber, Auto-Eject an','Externer Input: Uran-Barren']]},
  {id:'QF',m:QE,x:1,y:1,z:0,step:3,name:'Quantum Entangloporter „Fluorit“',lab:'QE Fluorit',labCol:'#14b8a6',
   what:'Externer Input: Fluorit. Frequenz „Fluorit“ (privat).',
   faces:[['d','out','item','Fluorit → Dissolution Chamber, Auto-Eject an','Externer Input: Fluorit']]},
  {id:'QS',m:QE,x:1,y:0,z:-1,step:3,name:'Quantum Entangloporter „Schwefel“',lab:'QE Schwefel',labCol:'#14b8a6',
   what:'Externer Input: Schwefelstaub. Frequenz „Schwefel“ (privat).',
   faces:[['s','out','item','Schwefelstaub → Dissolution Chamber (Extra), Auto-Eject an','Externer Input: Schwefelstaub']]},
  {id:'O',m:'chemical_oxidizer',x:0,y:0,z:1,rot:'south',step:1,name:'Chemical Oxidizer',lab:'Oxidizer',
   what:'1 Yellow Cake → 250 mB Uranium Oxide',upg:'4 Speed · 31 Ticks pro Yellow Cake · reicht für 16,1 mB/t',
   faces:[['n','in','item','Yellow Cake von der Enrichment Chamber'],['e','out','gas','Uranium Oxide → Infuser, Auto-Eject an'],['d','energy','energy','Strom vom Kabel']]},
  {id:'I',m:'chemical_infuser',x:1,y:0,z:1,rot:'south',step:1,name:'Chemical Infuser',lab:'Infuser',
   what:'1 mB Hydrofluoric Acid + 1 mB Uranium Oxide → 2 mB Uranium Hexafluoride',upg:'3 Speed · 8 Vorgänge pro Tick · 16 mB/t',
   faces:[['n','lin','gas','Hydrofluoric Acid von der Dissolution Chamber'],['w','rin','gas','Uranium Oxide vom Oxidizer'],['e','out','gas','Uranium Hexafluoride → Centrifuge, Auto-Eject an'],['d','energy','energy','Strom vom Kabel']]},
  {id:'C',m:'isotopic_centrifuge',x:2,y:0,z:1,h:2,rot:'south',step:1,name:'Isotopic Centrifuge',lab:'Centrifuge',
   what:'1 mB Uranium Hexafluoride → 1 mB Fissile Fuel · 2 Blöcke hoch',upg:'4 Speed · 16 Vorgänge pro Tick · 16 mB/t (ohne Upgrades nur 1 mB/t!)',
   faces:[['w','in','gas','Uranium Hexafluoride vom Infuser'],['e','out','gas','Fissile Fuel → Puffer-Tank, Auto-Eject an'],['d','energy','energy','Strom vom Kabel']]},
  {id:'T',m:'chemical_tank',x:3,y:0,z:1,rot:'south',step:1,name:'Ultimate Chemical Tank (Puffer)',lab:'Puffer-Tank',
   what:'8.192.000 mB Fissile Fuel · ca. 11 h Reserve bei 10 mB/t',
   faces:[['w','in','gas','Fissile Fuel von der Centrifuge'],['e','out','gas','Fissile Fuel → Entangloporter, Auto-Eject an']]},
  {id:'Q',m:QE,x:4,y:0,z:1,step:1,name:'Quantum Entangloporter „Brennstoff“',lab:'QE Brennstoff',labCol:'#7ee36b',
   what:'Frequenz „Brennstoff“ (privat). Schickt Brennstoff und Wasser zum Kraftwerk (QE 1303 / 130 / −240).',
   faces:[['w','in','gas','Fissile Fuel vom Tank'],['n','in','fluid','Wasser vom Fluid Tank']]},
  {id:'F',m:'fluid_tank',x:4,y:0,z:0,step:2,name:'Fluid Tank (Wasser)',lab:'Wasser',labCol:'#5aa9ff',
   what:'Nur zum ersten Befüllen des Kraftwerks: mit dem Eimer oder einer Pumpe füllen. Danach läuft der Wasser-Kreislauf am Kraftwerk von selbst.',
   faces:[['s','out','fluid','Wasser → Entangloporter, Auto-Eject an']]},
  {id:'W',m:'chemical_tank',x:3,y:0,z:3,rot:'south',step:4,name:'Ultimate Chemical Tank (Müll)',lab:'☢ Müll-Tank',haz:1,
   what:'Nuclear Waste · ca. 11 h bei 10 mB/t. Besser: die Recycling-Anlage direkt hier anschließen (macht daraus wieder Brennstoff).',
   faces:[['e','in','gas','Atommüll vom Entangloporter „Müll“']]},
  {id:'Q2',m:QE,x:4,y:0,z:3,step:4,name:'Quantum Entangloporter „Müll“',lab:'☢ QE Müll',haz:1,
   what:'Frequenz „Müll“ (privat). Bringt den Atommüll vom Kraftwerk (QE 1305 / 130 / −240).',
   faces:[['w','out','gas','Atommüll → Müll-Tank, Auto-Eject an']]},
  {id:'FP',m:'flux_point',x:-1,y:-1,z:1,step:0,name:'Flux Point',lab:'Flux Point',labCol:'#c084fc',what:'Netz „ZeroTwo“. Gibt Strom an die Universal Cables ab.'},
  ...[[0,1],[1,1],[2,1],[0,0],[1,0]].map(([x,z])=>({m:'cable',x,y:-1,z,step:0,name:'Ultimate Universal Cable',what:'Liegt sichtbar auf dem Boden (Ebene 1), die Maschinen stehen darauf und nehmen den Strom über ihre Unterseite (Energy). Kann später verkleidet werden.'})),
 ],
 flows:[
  {a:'QU',b:'E',med:'item',col:'#c9a46a',name:'Uran-Barren'},{a:'QF',b:'D',med:'item',col:'#b8d4ff',name:'Fluorit'},{a:'QS',b:'D',med:'item',col:'#f0e05a',name:'Schwefel'},
  {a:'E',b:'O',med:'item',name:'Yellow Cake'},{a:'O',b:'I',med:'gas',col:'#e8d24a',name:'Uranium Oxide'},{a:'D',b:'I',med:'gas',col:'#5fd4e0',name:'Hydrofluoric Acid'},
  {a:'I',b:'C',med:'gas',col:'#b07cff',name:'Uranium Hexafluoride'},{a:'C',b:'T',med:'gas',col:'#7ee36b',name:'Fissile Fuel'},{a:'T',b:'Q',med:'gas',col:'#7ee36b',name:'Fissile Fuel'},
  {a:'F',b:'Q',med:'fluid',col:'#3b9bff',name:'Wasser'},{a:'Q2',b:'W',med:'gas',col:'#e3c13b',name:'Atommüll'},
 ],
 overview:`<h2>So funktioniert die Anlage</h2>
  <div class="card">Uran-Barren, Fluorit und Schwefelstaub kommen über drei <b>Quantum Entangloporter</b> (je eine Item-Sorte, weil ein QE nur einen Item-Slot hat). Jede Maschine gibt ihr Produkt per <b>Auto-Eject</b> an den Nachbarn weiter. Am Ende geht <b>Fissile Fuel</b> in den Entangloporter „Brennstoff“ zum Kraftwerk. Strom kommt vom <b>Flux Point</b> über Universal Cables, die auf dem Boden unter den Maschinen liegen (Ebene 1). Nichts muss in den Boden – das geht auch auf dem Netherdach.</div>
  <table class="t" style="margin:6px 0 4px">
   <tr><td>Fissile Fuel pro Uran-Barren</td><td class="r">1.000 mB</td></tr>
   <tr><td>Durchsatz mit Upgrades</td><td class="r">~16 mB/t</td></tr>
   <tr><td>Bedarf bei 10 mB/t</td><td class="r">12 Barren / min</td></tr>
   <tr><td></td><td class="r">6 Fluorit · 3 Schwefel / min</td></tr>
  </table>
  <div class="card wn"><b>Ohne Upgrades zu langsam:</b> Die Isotopic Centrifuge schafft ohne Speed-Upgrades nur 1 mB/t.</div>
  <div class="card okc"><b>Mit Recycling:</b> Die Recycling-Anlage macht aus dem Atommüll wieder ca. 80 % des Brennstoffs. Dann brauchst du nur noch ca. 2–3 Barren pro Minute.</div>`,
};

// Kabel liegen sichtbar auf dem Boden (Ebene 1), alle Maschinen eine Ebene darüber
CFG.blocks.forEach(b=>{ b.y+=1; });
[[3,1,1],[4,1,1],[4,0,2],[1,-1,3],[3,3,4],[4,3,4]].forEach(([x,z,step])=>CFG.blocks.push({m:'cube:mc_stone',x,y:0,z,step,name:'Stützblock (beliebiger Vollblock)',
  what:'Trägt Tank oder Entangloporter auf Höhe der Maschinen (Ebene 2), damit alle Seiten aneinander liegen. Jeder Vollblock geht.'}));
// ---------- Bauplan-Seite ----------
const AB={E:'EC',D:'DC',O:'OX',I:'IN',C:'IC',T:'T',Q:'QE',F:'FT',W:'W',Q2:'QE',QU:'U',QF:'F',QS:'S',FP:'FP'};
CFG.blocks.forEach(b=>{ if(AB[b.id]) b.abbr=AB[b.id]; });
CFG.guide={
 key:'brennstoff', link3d:'brennstoff-3d.html',
 lead:'Die Anlage steht an deiner <b>Basis</b>. Sie macht aus Uran-Barren, Fluorit und Schwefelstaub den Brennstoff <b>Fissile Fuel</b> und schickt ihn über den Entangloporter <b>„Brennstoff“</b> zum Kraftwerk auf dem Netherdach. Die Rohstoffe kommen über drei eigene Entangloporter (je einer pro Item-Sorte). Die Maschinen geben ihre Produkte selbst an die nächste weiter (Auto-Eject). Strom kommt vom <b>Flux Point</b> über Kabel auf Ebene 1 direkt unter den Maschinen – nichts wird in den Boden gegraben, also auch auf dem Netherdach baubar.',
 kpis:[['1.000 mB','Fissile Fuel pro Uran-Barren'],['~16 mB/t','max. Durchsatz mit Upgrades'],['720 / h','Uran-Barren bei 10 mB/t'],['7 × 6 × 3','Kacheln, 3 Ebenen hoch']],
 chainHead:'pro Barren',
 chain:[['Enrichment Chamber','1 Uran-Barren → 2 Yellow Cake Uranium','1 Barren'],['Chemical Oxidizer','1 Yellow Cake → 250 mB Uranium Oxide','500 mB'],
  ['Chemical Dissolution Chamber','1 Fluorit + 1 mB Sulfuric Acid → 1.000 mB Hydrofluoric Acid','½ Fluorit · ¼ Schwefelstaub'],
  ['Chemical Infuser','1 mB Hydrofluoric Acid + 1 mB Uranium Oxide → 2 mB Uranium Hexafluoride','1.000 mB'],['Isotopic Centrifuge','1 mB Uranium Hexafluoride → 1 mB Fissile Fuel','<b>1.000 mB</b>']],
 note:'Rezepte und Upgrade-Formeln aus der Server-JAR (Mekanism 10.4.16). Geschwindigkeiten gerechnet, im Spiel noch nicht nachgemessen.',
 materials:{
  craft:[['Enrichment Chamber',1,'4 Basic Alloy, 2 Basic Circuit, 2 Eisen, 1 Steel Casing'],['Chemical Oxidizer',1,'4 Infused Alloy, 2 Basic Circuit, 1 Personal Chest, 1 Dynamic Tank, 1 Basic Chemical Tank'],
   ['Chemical Dissolution Chamber',1,'4 Refined Obsidian, 2 Ultimate Circuit, 2 Basic Chemical Tank, 1 Steel Casing'],['Chemical Infuser',1,'4 Infused Alloy, 2 Basic Circuit, 2 Basic Chemical Tank, 1 Steel Casing'],
   ['Isotopic Centrifuge',1,'6 Blei, 2 Ultimate Circuit, 1 Basic Chemical Tank'],['Ultimate Chemical Tank',2,'je 4 Atomic Alloy, 4 Osmium, 1 Elite Chemical Tank'],
   ['Quantum Entangloporter',5,'je 4 Refined Obsidian, 2 Ultimate Circuit, 2 Atomic Alloy, 1 Teleportation Core (3 Rohstoffe + Brennstoff + Müll)'],
   ['Fluid Tank (Basic reicht)',1,'zum Befüllen mit Wasser'],['Ultimate Universal Cable',5,'8 Stück pro Craft: 8 Elite Cable + 1 Atomic Alloy'],['Flux Point',1,'Flux Networks'],
   ['Speed Upgrade',15,'je 1 Osmiumstaub, 2 Infused Alloy, 2 Glas'],['Configurator',1,'zum Einstellen der Seiten']],
  raw:[['Atomic Alloy',19],['Ultimate Circuit',14],['Refined Obsidian',24],['Teleportation Core',5],['Infused Alloy',38],['Basic Circuit',6],['Basic Alloy',4],['Basic Chemical Tank',6],['Steel Casing',3],['Blei',6],['Osmiumstaub',15],['Glas',30]],
  rawTitle:'Hauptbauteile gesamt', rawNote:'Ohne die Zwischenstufen der Tanks und Kabel (Elite Tank, Elite Cable).'},
 sections:[
  {id:'upgrades',title:'Upgrades und Durchsatz',html:"<p class=\"lead\">Mit diesen Speed-Upgrades schafft die Kette ca. <b>16 mB/t</b>. Das ist mehr, als dein Reaktor verbrennen kann (Turbine heute ca. 9,6 mB/t, Reaktor max. 12 mB/t). Energy-Upgrades sind freiwillig, sie senken nur den Stromverbrauch.</p>\n  <div class=\"card tw\"><table class=\"t\">\n    <tr><th>Maschine</th><th>Speed</th><th>Takt</th><th>reicht für Fissile Fuel</th></tr>\n    <tr><td>Enrichment Chamber</td><td class=\"n\">4</td><td>63 Ticks pro Barren (sonst 200)</td><td class=\"n\">15,9 mB/t</td></tr>\n    <tr><td>Chemical Oxidizer</td><td class=\"n\">4</td><td>31 Ticks pro Yellow Cake (sonst 100)</td><td class=\"n\">16,1 mB/t</td></tr>\n    <tr><td>Chemical Dissolution Chamber</td><td class=\"n\">0</td><td>100 Ticks pro Fluorit</td><td class=\"n\">20 mB/t</td></tr>\n    <tr><td>Chemical Infuser</td><td class=\"n\">3</td><td>8 Vorgänge pro Tick (sonst 1)</td><td class=\"n\">16 mB/t</td></tr>\n    <tr><td>Isotopic Centrifuge</td><td class=\"n\">4</td><td>16 Vorgänge pro Tick (sonst 1)</td><td class=\"n\">16 mB/t</td></tr>\n  </table></div>\n  <div class=\"muted\" style=\"font-size:13px;margin-top:6px\">Formeln aus dem Code: Ticks = Grundzeit × 10^(−Speed/8). Bei Infuser und Centrifuge verdoppelt jedes Speed-Upgrade die Vorgänge pro Tick. Ohne Upgrades schafft die Centrifuge nur <b>1 mB/t</b>.</div>\n  <div class=\"grid2\" style=\"margin-top:14px\">\n    <div class=\"card\"><h3>Bedarf bei 10 mB/t</h3><table class=\"t\">\n      <tr><td>Uran-Barren</td><td class=\"n\">12 / min · 720 / h</td></tr>\n      <tr><td>= Uran-Erz durch die Erzverarbeitung (1 Erz → 2 Barren)</td><td class=\"n\">360 / h</td></tr>\n      <tr><td>Fluorit</td><td class=\"n\">6 / min · 360 / h</td></tr>\n      <tr><td>Schwefelstaub</td><td class=\"n\">3 / min · 180 / h</td></tr>\n    </table></div>\n    <div class=\"card\"><h3>Woher die Rohstoffe kommen</h3><table class=\"t\">\n      <tr><td>Uran</td><td>Uran-Erz durch deine Erzverarbeitung, oder T4-Void-Miner mit Metallic-Ore-Linse</td></tr>\n      <tr><td>Fluorit</td><td>Fluorit-Erz (Oberwelt) → Enrichment Chamber → 6 Fluorit</td></tr>\n      <tr><td>Schwefel</td><td>Mystical Agriculture: 3 Sulfur Essence → 8 Staub (am einfachsten). Oder IE-Crusher mit Blaze Rods (50 % Schwefel nebenbei).</td></tr>\n    </table></div>\n  </div>"},
  {id:'reaktor',title:'Reaktor-Seite (Netherdach)',html:"<p class=\"lead\">Am Kraftwerk kommt alles über den Entangloporter vor dem Input-Port an. Brennstoff (Gas) und Wasser (Flüssigkeit) laufen auf <b>derselben Frequenz</b>, sie stören sich nicht.</p>\n  <div class=\"grid2\">\n    <div class=\"card\"><h3>QE „Brennstoff“ · 1303 / 130 / −240</h3><table class=\"t\">\n      <tr><td>Frequenz</td><td><b>Brennstoff</b>, privat</td></tr>\n      <tr><td>Gase</td><td>Südseite (zum Port 1303 / 130 / −239) = <b>Output</b>, Auto-Eject an</td></tr>\n      <tr><td>Flüssigkeiten</td><td>Südseite = <b>Output</b>, Auto-Eject an</td></tr>\n    </table></div>\n    <div class=\"card\"><h3>QE „Müll“ · 1305 / 130 / −240</h3><table class=\"t\">\n      <tr><td>Frequenz</td><td><b>Müll</b>, privat</td></tr>\n      <tr><td>Gase</td><td>Südseite (zum Port 1305 / 130 / −239, Modus Output Waste) = <b>Input</b></td></tr>\n    </table></div>\n  </div>\n  <div class=\"ok\">Der Wasser-Kreislauf läuft im Betrieb von selbst: Die Condensers der Turbine geben Wasser über das Ventil 1299 / 130 / −237 zurück in den Port 1300 / 130 / −237. Wasser brauchst du nur einmal zum Befüllen.</div>"},
  {id:'muell',title:'Atommüll',html:"<div class=\"card\">\n    <p style=\"margin-top:0\">Der Reaktor macht pro mB Brennstoff 1 mB <b>Nuclear Waste</b>, bei 10 mB/t also 720.000 mB pro Stunde. Der Müll-Tank (Ultimate Chemical Tank, 8.192.000 mB) ist nach ca. <b>11 Stunden</b> voll.</p>\n    <div class=\"warn\"><b>Ist der Müll-Tank voll,</b> füllt sich der Müll-Tank im Reaktor. Dann löst dein Logic Adapter <b>Excess Waste</b> den Not-Aus aus. Das ist gewollt, aber das Kraftwerk steht dann. Leere den Tank vorher oder baue die Weiterverarbeitung:</div>\n    <table class=\"t\" style=\"margin-top:10px\">\n      <tr><td>Plutonium</td><td>Isotopic Centrifuge: 10 mB Nuclear Waste → 1 mB Plutonium</td></tr>\n      <tr><td>Polonium (für die Fusion)</td><td>Solar Neutron Activator: 10 mB Nuclear Waste → 1 mB Polonium (braucht Tageslicht)</td></tr>\n    </table>\n    <div class=\"warn\"><b>Strahlung:</b> Tanks und QEs mit Müll nie gefüllt abbauen. Sonst wird die Strahlung frei. Beim Umbauen Hazmat-Anzug tragen.</div>\n  </div><div class=\"ok\"><b>Recycling:</b> Die <a href=\"../recycling/\">Recycling-Anlage</a> macht aus dem Müll wieder ca. 80 % des Brennstoffs.</div>"},
