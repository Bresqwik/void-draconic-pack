<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fission 3D</title>
<style>
:root{--bg:#0c0f15;--panel:#141922;--panel2:#1b2230;--panel3:#232c3d;--line:#2b3547;--text:#e7ecf3;--muted:#8a96a8;--hot:#ff4d4d;--warn:#f5a524;--ok:#5ee38a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px 14px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;flex:none}
.back{display:inline-grid;place-items:center;height:34px;min-width:34px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);text-decoration:none;font-size:13px;flex:none}
header h1{font-size:15px;margin:0;white-space:nowrap}
.grow{flex:1}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{background:none;border:0;color:var(--muted);padding:6px 11px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap}
.chk input{width:16px;height:16px;accent-color:#b07cff}
#controls{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
main{display:flex;flex:1;min-height:0;position:relative}
#view{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none}
#view canvas{display:block}
aside{width:390px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;flex:none}
#sideBody{overflow:auto;padding:14px;flex:1}
#handle{display:none}
.overlay{position:absolute;background:#10141cdd;border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(4px)}
#stepper{left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#stepper .nav{display:flex;gap:6px}
#stepper button{background:var(--panel3);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;min-width:42px}
#stepper input[type=range]{flex:1;min-width:140px;accent-color:#b07cff}
#stepTitle{font-weight:700;min-width:220px}
#stepTitle small{display:block;color:var(--muted);font-weight:400}
#legend{left:12px;top:12px;font-size:12px;display:flex;flex-direction:column;gap:3px;max-height:calc(100% - 120px);overflow:auto;max-width:260px}
#legend div{display:flex;align-items:center;gap:7px}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;pointer-events:none}
.sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid #0006;display:inline-block}
#tip{position:fixed;pointer-events:none;background:#0b0e14ee;border:1px solid var(--line);padding:5px 8px;border-radius:6px;font-size:12px;display:none;z-index:9;white-space:nowrap}
h2{font-size:16px;margin:2px 0 6px}
h4{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;font-weight:600}
.muted{color:var(--muted)}
.coord{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.hz{border-left:4px solid var(--hot);background:#24121a}
.wn{border-left:4px solid var(--warn);background:#221a10}
.okc{border-left:4px solid var(--ok);background:#10241a}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r{text-align:right;font-weight:600;white-space:nowrap;padding-left:8px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;color:#fff;white-space:nowrap}
button.link{background:none;border:0;color:#7cc7ff;cursor:pointer;padding:0;font:inherit}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini button{background:var(--panel3);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:inherit;font-size:12.5px;cursor:pointer}
@media (max-width:1100px){aside{width:330px}}
@media (max-width:760px){
  header{padding:8px 10px}
  header h1{font-size:14px}
  #controls{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  aside{position:absolute;left:0;right:0;bottom:0;width:auto;height:min(70%,560px);border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px #0008;transform:translateY(calc(100% - 50px));transition:transform .28s;z-index:6}
  aside.open{transform:none}
  #handle{display:flex;align-items:center;gap:8px;height:50px;padding:0 16px;border:0;background:none;color:var(--text);font:600 14px system-ui;width:100%;flex:none}
  #handle .chev{margin-left:auto;color:var(--muted)}
  #stepper{bottom:58px;left:8px;right:8px;padding:8px}
  #stepTitle{min-width:0;flex-basis:100%}
  #legend{display:none}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header>
  <a class="back" href="/admin/" target="_top" aria-label="Zur Übersicht">←</a>
  <h1>Fission-Kraftwerk · 3D</h1>
  <a class="back" href="./">📘 Anleitung</a>
  <div class="grow"></div>
  <div id="controls"></div>
</header>
<main>
  <div id="view">
    <div id="loading">Lade Original-Modelle …</div>
    <div id="legend" class="overlay"></div>
    <div id="stepper" class="overlay">
      <div class="nav"><button id="prev" aria-label="zurück">◀</button><button id="next" aria-label="weiter">▶</button></div>
      <div id="stepTitle"></div>
      <input type="range" id="slider" min="0" max="1" value="1" aria-label="Schritt">
    </div>
  </div>
  <aside id="sheet"><button id="handle" type="button"><span id="handleTxt">Info</span><span class="chev">▲</span></button><div id="sideBody"></div></aside>
</main>
<div id="tip"></div>
<script type="module">
import {start} from '../lib/b3d.js';
// Fission-Kraftwerk (Netherdach) – Weltkoordinaten, Plan wie in der Anleitung
const RX={x0:1283,x1:1289,z0:-254,z1:-248,y0:128,y1:133};
const TB={x0:1290,x1:1296,z0:-254,z1:-248,y0:128,y1:145};
const FUEL=[[1285,-252],[1287,-252],[1285,-250],[1287,-250]];
const COILS=[[1293,-251],[1292,-251],[1294,-251],[1293,-252],[1293,-250],[1292,-252],[1294,-250]];
const COND=[[1291,-253],[1295,-253],[1291,-249],[1295,-249]];
const VENTS=[[1291,-254],[1292,-254],[1293,-254],[1294,-254],[1295,-254],[1292,-248],[1294,-248]];
const RED='Teil des Not-Aus (SCRAM).';
const SPEC={ // y 130: [typ, Kürzel, Name, Text, Modell, Seiten]
 '1289,-252':['port','P1','Fission Reactor Port – Output Coolant','Gibt Dampf direkt an Ventil V1 ab. Mit dem Configurator auf „Output Coolant“ stellen.','fission_port_output_coolant',[['e','out','gas','Dampf → Turbinen-Ventil V1']]],
 '1289,-250':['port','P2','Fission Reactor Port – Input','Bekommt das kondensierte Wasser von Ventil V2.','fission_port_input',[['e','in','fluid','Wasser von Ventil V2']]],
 '1286,-248':['port','P3','Fission Reactor Port – Input','Bekommt Fissile Fuel und Wasser vom Entangloporter „Brennstoff“.','fission_port_input',[['s','in','gas','Fissile Fuel vom QE „Brennstoff“'],['s','in','fluid','Wasser zum Befüllen vom QE „Brennstoff“']]],
 '1284,-248':['port','P4','Fission Reactor Port – Output Waste','Gibt Atommüll an den Entangloporter „Müll“. ☢ Muss immer abfließen können!','fission_port_output_waste',[['s','out','gas','Atommüll → QE „Müll“']]],
 '1290,-252':['valve','V1','Turbine Valve','Nimmt den Dampf von P1 auf.','turbine_valve',[['w','in','gas','Dampf von P1']]],
 '1290,-250':['valve','V2','Turbine Valve','Gibt Wasser aus den Condensers an P2 zurück.','turbine_valve',[['w','out','fluid','Wasser → P2']]],
 '1296,-251':['valve','V3','Turbine Valve','Gibt den Strom an den Flux Plug ab.','turbine_valve',[['e','out','energy','Strom → Flux Plug']]],
 '1286,-247':['qe','QE B','Quantum Entangloporter „Brennstoff“','Private Frequenz „Brennstoff“. Gas- und Flüssigkeits-Seite Norden (zum Port P3) auf Output, Auto-Eject an. Kommt von der Fissile-Fuel-Anlage an deiner Basis.','quantum_entangloporter',[['n','out','gas','Fissile Fuel → P3','Externer Input: Fissile Fuel (Basis)'],['n','out','fluid','Wasser → P3']]],
 '1284,-247':['qe','QE M','Quantum Entangloporter „Müll“','Private Frequenz „Müll“. Nimmt den Müll von P4 an und schickt ihn zur Recycling-Anlage. ☢ Nie gefüllt abbauen.','quantum_entangloporter',[['n','in','gas','Atommüll von P4']]],
 '1297,-251':['flux','FP','Flux Plug','Netz „ZeroTwo“. Nimmt den Turbinen-Strom auf und speist ihn ins Netz.','flux_plug',[['w','in','energy','Strom von Ventil V3']]],
 '1283,-253':['logic','L1','Logic Adapter – TEMPERATURE','Gibt Redstone ab 1.200 K – genau dann beginnt der Reaktor Schaden zu nehmen.','fission_logic_adapter'],
 '1283,-252':['logic','L3','Logic Adapter – EXCESS WASTE','Gibt Redstone, wenn der Müll-Tank voll ist.','fission_logic_adapter'],
 '1283,-250':['logic','L2','Logic Adapter – ACTIVATION','Reaktor läuft nur, solange L2 Redstone bekommt. Signal weg = sofort aus (im Mekanism-Code geprüft).','fission_logic_adapter'],
 '1282,-253':['dust','','Redstone','Verbindet L1 mit dem Repeater. '+RED,'dust'],
 '1282,-252':['dust','','Redstone','Verbindet L3 mit dem Repeater. '+RED,'dust'],
 '1281,-252':['rep','','Repeater (zeigt nach Westen)','Gibt das Alarm-Signal stark an Block B. '+RED,'repeater'],
 '1280,-252':['blk','B','Block B (beliebiger Vollblock)','Trägt Fackel und Hebel. '+RED,'cube:mc_stone'],
 '1279,-252':['lever','⏻','Hebel – Not-Aus','Umlegen = Block B bekommt Strom = Fackel aus = Reaktor aus.','lever'],
 '1280,-251':['torch','','Redstone-Fackel an Block B','Normalbetrieb: an → L2 bekommt Strom. '+RED,'torch'],
 '1280,-250':['dust','','Redstone','Von der Fackel zu L2. '+RED,'dust'],
 '1281,-250':['dust','','Redstone','Von der Fackel zu L2. '+RED,'dust'],
 '1282,-250':['dust','','Redstone','Zeigt in L2. '+RED,'dust'],
};
const INFO={
 rcas:['fission_casing','Fission Reactor Casing','Hülle des Reaktors. Kanten müssen Casing sein, Wandflächen dürfen auch Reactor Glass sein.'],
 tcas:['turbine_casing','Turbine Casing','Hülle der Turbine. Wandflächen dürfen auch Structural Glass sein.'],
 fuel:['fission_fuel_assembly','Fission Fuel Assembly','4 Säulen à 3 Stück. Jede Assembly erlaubt 1 mB/t Brennrate. Säulen dürfen sich nicht berühren.'],
 rod:['fission_control_rod','Control Rod Assembly','Gehört oben auf jede Brennstoff-Säule.'],
 rotor:['turbine_rotor','Turbine Rotor + 2 Blades','14 Stück übereinander (y 129–142). Auf jeden Rotor 2 Blades (Rechtsklick).'],
 complex:['rotational_complex','Rotational Complex','Sitzt auf dem obersten Rotor (y 143).'],
 disp:['pressure_disperser','Pressure Disperser','Füllt die ganze Ebene y 143 um den Complex herum (24 Stück).'],
 coil:['electromagnetic_coil','Electromagnetic Coil','7 Stück in y 144, müssen sich berühren und den Complex berühren. 1 Coil pro 4 Blades.'],
 cond:['saturating_condenser','Saturating Condenser','4 Stück in y 144. Machen aus Dampf wieder Wasser (je 64.000 mB/t).'],
 vent:['turbine_vent','Turbine Vent','7 Stück in der Wand auf y 144. Je 32.000 mB/t Dampf-Durchfluss.'],
 way:['cube:mc_polished_blackstone_bricks','Waystone (Platz)','Damit du schnell hinkommst.'],
};
function typeAt(x,y,z){
  if(y===130&&SPEC[x+','+z]) return 'spec';
  if(y===128&&x===1288&&z===-244) return 'way';
  const inR=x>=RX.x0&&x<=RX.x1&&z>=RX.z0&&z<=RX.z1&&y>=RX.y0&&y<=RX.y1, inT=x>=TB.x0&&x<=TB.x1&&z>=TB.z0&&z<=TB.z1&&y>=TB.y0&&y<=TB.y1;
  if(inR){ if(x===RX.x0||x===RX.x1||z===RX.z0||z===RX.z1||y===RX.y0||y===RX.y1) return 'rcas'; if(FUEL.some(([a,b])=>a===x&&b===z)) return y===132?'rod':'fuel'; return null; }
  if(inT){ const wall=x===TB.x0||x===TB.x1||z===TB.z0||z===TB.z1; if(y===TB.y0||y===TB.y1) return 'tcas';
    if(wall) return (y===144&&VENTS.some(([a,b])=>a===x&&b===z))?'vent':'tcas';
    const c=x===1293&&z===-251; if(y>=129&&y<=142) return c?'rotor':null; if(y===143) return c?'complex':'disp';
    if(y===144){ if(COILS.some(([a,b])=>a===x&&b===z)) return 'coil'; if(COND.some(([a,b])=>a===x&&b===z)) return 'cond'; } }
  return null;
}
const inRb=b=>b.x>=RX.x0&&b.x<=RX.x1&&b.z>=RX.z0&&b.z<=RX.z1, inTb=b=>b.x>=TB.x0&&b.x<=TB.x1&&b.z>=TB.z0&&b.z<=TB.z1;
const STEPS=[
 {t:'Waystone & Bauplatz',s:'Chunks x 80–81 / z −16 … −15 claimen + force-loaden',f:b=>b.k==='way'},
 {t:'Reaktor-Boden',s:'y 128 · 7 × 7 Casing',f:b=>inRb(b)&&b.y===128},
 {t:'Reaktor-Wände',s:'y 129–132 · inkl. Ports P1–P4 und Logic Adapter',f:b=>inRb(b)&&b.y>=129&&b.y<=132&&!['fuel','rod'].includes(b.k)},
 {t:'Brennstoff-Säulen',s:'4 × (3 Fuel Assembly + 1 Control Rod)',f:b=>['fuel','rod'].includes(b.k)},
 {t:'Reaktor-Decke',s:'y 133 · 7 × 7 Casing',f:b=>inRb(b)&&b.y===133},
 {t:'Turbinen-Boden',s:'y 128 · 7 × 7 Casing',f:b=>inTb(b)&&b.y===128},
 {t:'Turbinen-Wände unten',s:'y 129–142 · Ventile V1/V2 an der Reaktor-Seite, V3 Osten',f:b=>inTb(b)&&b.y>=129&&b.y<=142&&b.k!=='rotor'},
 {t:'Rotor + Blades',s:'14 Rotoren, je 2 Blades',f:b=>b.k==='rotor'},
 {t:'Disperser-Ebene',s:'y 143 · Complex + 24 Dispersers + Wand',f:b=>inTb(b)&&b.y===143},
 {t:'Coils, Condenser, Vents',s:'y 144 · 7 Coils, 4 Condensers, 7 Vents',f:b=>inTb(b)&&b.y===144},
 {t:'Turbinen-Dach',s:'y 145 · 7 × 7 Casing',f:b=>inTb(b)&&b.y===145},
 {t:'Entangloporter & Flux',s:'QE „Brennstoff“, QE „Müll“, Flux Plug',f:b=>['qe','flux'].includes(b.k)},
 {t:'Not-Aus',s:'Redstone, Repeater, Block, Fackel, Hebel',f:b=>['dust','rep','blk','lever','torch'].includes(b.k)},
];
const blocks=[];
for(let y=128;y<=145;y++) for(let x=1279;x<=1298;x++) for(let z=-256;z<=-243;z++){ const t=typeAt(x,y,z); if(!t) continue;
  if(t==='spec'){ const s=SPEC[x+','+z]; blocks.push({id:s[1]&&s[1]!=='⏻'?s[1]:undefined,k:s[0],m:s[4],x,y,z,name:s[2],lab:['port','valve','qe','flux','logic'].includes(s[0])?s[1]:'',what:s[3],faces:s[5],noNone:1,
    labCol:{port:'#ff9a3d',valve:'#5aa9ff',qe:'#d6b4ff',flux:'#c084fc',logic:'#ff6b6b'}[s[0]],haz:s[1]==='QE M'||s[1]==='P4'?1:0,
    warn:['port','logic'].includes(s[0])?'Teil des Reaktors: im Umkreis von 8 Blöcken droht bei einer Kernschmelze Explosion + Strahlung.':'',
    listName:s[0]==='port'?s[2]:s[0]==='logic'?'Fission Reactor Logic Adapter':s[0]==='valve'?'Turbine Valve':s[0]==='dust'?'Redstone':s[2]}); continue; }
  const I=INFO[t]; blocks.push({k:t,m:I[0],x,y,z,name:I[1],what:I[2],hull:t==='rcas'||t==='tcas',
    warn:['fuel','rod','rcas'].includes(t)?'Teil des Reaktors: im Umkreis von 8 Blöcken droht bei einer Kernschmelze Explosion + Strahlung.':''}); }
blocks.forEach(b=>{ b.step=STEPS.findIndex(s=>s.f(b)); if(b.step<0) b.step=2; });
const CFG={
 worldCoords:true, spread:false, allowSpread:false, layers:true, background:'#14090c', fog:[55,110], maxDist:80, shadowRange:30, exposure:.95,
 center:[1290,134,-251], cam:[1270,147,-226], ground:{x0:1278,x1:1299,z0:-257,z1:-242,y:128,tex:'mc_bedrock'},
 cut:b=>b.z>-251&&(inRb(b)||inTb(b)),
 hazards:[{pos:[1286.5,130.5,-250.5],r:8,label:'Kernschmelze: Radius 8',ly:9.5,scale:.9},{pos:[1284.5,131.4,-246.5],label:'☢ Müll',col:'#ffd84d',scale:.55}],
 steps:STEPS.map(({t,s})=>({t,s})), blocks,
 flows:[{a:'QE B',b:'P3',med:'gas',col:'#7ee36b',name:'Fissile Fuel',ya:.5,yb:.5},{a:'P4',b:'QE M',med:'gas',col:'#e3c13b',name:'Atommüll'},
  {a:'P1',b:'V1',med:'gas',col:'#d9e2ec',name:'Dampf'},{a:'V2',b:'P2',med:'fluid',col:'#3b9bff',name:'Wasser'},{a:'V3',b:'FP',med:'energy',col:'#ff5ad1',name:'Strom'}],
 overview:`<h2>Gefahren – bitte lesen</h2>
  <div class="card hz"><b>Kernschmelze (Explosion, Radius 8, viel Strahlung)</b><br><span class="muted">Ab <b>1.200 K</b> nimmt der Reaktor Schaden (unter 1.200 K heilt er wieder). Bei <b>100 %</b> Schaden und ≥ 1.200 K kann er jede Sekunde schmelzen. Kernschmelzen sind auf dem Server <b>an</b>.</span></div>
  <div class="card wn"><b>Not-Aus richtig auslösen</b><br><span class="muted">Der Logic Adapter „Damaged“ meldet erst bei 100 % – zu spät. Deshalb löst <b>L1 „Temperature“</b> aus (ab 1.200 K) und <b>L3 „Excess Waste“</b> (Müll-Tank voll). Beide schalten über die Fackel <b>L2 „Activation“</b> ab.</span></div>
  <div class="card hz"><b>Strahlung durch Müll</b><br><span class="muted">Ist der Müll-Tank voll, wird alles, was nicht mehr hineinpasst, <b>als Strahlung freigesetzt</b>. Der Müll muss über QE „Müll“ immer abfließen – zur Recycling-Anlage an deiner Basis.</span></div>
  <div class="card wn"><b>Strom muss abfließen</b><br><span class="muted">Ist die Turbine voll (Flux-Netz nimmt nichts mehr), stoppt sie. Dann staut sich der Dampf, der Reaktor wird heiß → der Temperatur-Not-Aus greift. Brennrate niedrig anfangen.</span></div>
  <div class="card okc"><b>Schutz</b><br><span class="muted">Komplette <b>Hazmat-Ausrüstung</b>, <b>Geigerzähler</b> und <b>Dosimeter</b> dabei haben.</span></div>
  <div class="card"><b>Anschlüsse:</b> Brennstoff + Wasser kommen per QE „Brennstoff“ von der Basis, Müll geht per QE „Müll“ zum Recycling, Strom per <b>Flux Plug</b> ins Netz „ZeroTwo“. Mit „Ebenen“ siehst du den Bau Reihe für Reihe, mit „Schnitt“ das Innere.</div>`,
};

start(CFG);
</script>
</body>
</html>
