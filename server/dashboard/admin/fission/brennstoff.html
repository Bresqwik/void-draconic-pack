<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fissile-Fuel-Anlage</title>
<style>
:root{
  --bg:#0c0f15;--panel:#141922;--panel2:#1b2230;--panel3:#232c3d;--line:#2b3547;
  --text:#e7ecf3;--muted:#8a96a8;
  --fuel:#7ee36b;--water:#3b9bff;--waste:#e3c13b;--power:#ff5ad1;--item:#c9a46a;
  --uo:#e8d24a;--hf:#5fd4e0;--uf6:#b07cff;--acid:#f08a3c;--laser:#ff3d6a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:#7cc7ff}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#141922f2;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.back{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);text-decoration:none;flex:none}
header h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.tag{font:700 11px ui-monospace,monospace;padding:3px 8px;border-radius:999px;background:#2a1a10;color:#ffb36b;border:1px solid #5a3a1a;white-space:nowrap}
nav.toc{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);scrollbar-width:none;position:sticky;top:55px;z-index:4}
nav.toc::-webkit-scrollbar{display:none}
nav.toc a{flex:none;text-decoration:none;color:var(--muted);font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line)}
nav.toc a:hover{color:var(--text);background:var(--panel3)}
main{max-width:1150px;margin:0 auto;padding:16px}
section{margin:20px 0 38px}
h2{font-size:21px;margin:0 0 6px}
h3{font-size:16px;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 14px;max-width:75ch}
.muted{color:var(--muted)}
code{font:12.5px ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--panel3);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px;letter-spacing:.2px}
.kpi span{font-size:12px;color:var(--muted)}
.tip{border-left:3px solid #f5a524;background:#1e1a10;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:10px;font-size:14px}
.warn{border-left:3px solid #f4566e;background:#22121a;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:10px;font-size:14px}
.ok{border-left:3px solid #5ee38a;background:#10241a;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:10px;font-size:14px}
svg{display:block;width:100%;height:auto}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid #0006}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center}
.cell{cursor:pointer}
.cell rect.b{transition:stroke .15s,stroke-width .15s}
.cell:hover rect.b,.cell.sel rect.b{stroke:#fff;stroke-width:3}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel3);margin:0 4px 4px 0}
.face{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:14px;margin-top:8px}
.face b{color:var(--muted);font-weight:600}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.step .n{width:30px;height:30px;border-radius:50%;background:#ff7a3d;color:#fff;font-weight:800;display:grid;place-items:center}
.step h3{margin:3px 0 6px}
.step ul{margin:4px 0 0;padding-left:18px}
.step.done{border-color:#1f4a31;background:linear-gradient(0deg,#10241a55,#10241a55),var(--panel)}
.check{display:flex;gap:8px;align-items:center;margin-top:8px;cursor:pointer;user-select:none;font-size:14px;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:#5ee38a}
.progress{height:8px;background:var(--panel3);border-radius:999px;overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a3d,#5ee38a);transition:width .3s}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 16px 40px}

.layers{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.layers button{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.layers button.on{background:var(--panel3);color:var(--text);border-color:#4b5a73}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;color:#fff;white-space:nowrap}
img.ic,span.ic{display:inline-block;width:28px;height:28px;border-radius:5px;image-rendering:pixelated;vertical-align:middle;border:1px solid #0008}
.big3d{display:flex;flex-direction:column;gap:2px;margin-top:14px;padding:14px 16px;border-radius:14px;text-decoration:none;color:var(--text);font-weight:800;font-size:17px;background:linear-gradient(135deg,#3b1d6e,#1b2a4a);border:1px solid #6b4bb3}
.big3d span{font-weight:400;font-size:13px;color:#c9b8ff}
.cell{cursor:pointer}.cell:hover rect.b,.cell.sel rect.b{stroke:#fff;stroke-width:3}
</style>
</head>

   faces:[['u','in','item','Fluorit vom QE „Fluorit“'],['n','extra','item','Schwefelstaub vom QE „Schwefel“ → Extra-Slot'],['s','out','gas','Hydrofluoric Acid → Infuser, Auto-Eject an'],['d','energy','energy','Strom vom Kabel']]},

 overview:`<h2>So funktioniert die Anlage</h2>

CFG.guide={
 key:'brennstoff', link3d:'brennstoff-3d.html',
 lead:'Die Anlage steht an deiner <b>Basis</b>. Sie macht aus Uran-Barren, Fluorit und Schwefelstaub den Brennstoff <b>Fissile Fuel</b> und schickt ihn über den Entangloporter <b>„Brennstoff“</b> zum Kraftwerk auf dem Netherdach. Die Rohstoffe kommen über drei eigene Entangloporter (je einer pro Item-Sorte). Die Maschinen geben ihre Produkte selbst an die nächste weiter (Auto-Eject). Strom kommt vom <b>Flux Point</b> über Kabel im Boden.',

  craft:[['Enrichment Chamber',1,'4 Basic Alloy, 2 Basic Circuit, 2 Eisen, 1 Steel Casing'],['Chemical Oxidizer',1,'4 Infused Alloy, 2 Basic Circuit, 1 Personal Chest, 1 Dynamic Tank, 1 Basic Chemical Tank'],
   ['Chemical Dissolution Chamber',1,'4 Refined Obsidian, 2 Ultimate Circuit, 2 Basic Chemical Tank, 1 Steel Casing'],['Chemical Infuser',1,'4 Infused Alloy, 2 Basic Circuit, 2 Basic Chemical Tank, 1 Steel Casing'],

   ['Speed Upgrade',15,'je 1 Osmiumstaub, 2 Infused Alloy, 2 Glas'],['Configurator',1,'zum Einstellen der Seiten']],
  raw:[['Atomic Alloy',19],['Ultimate Circuit',14],['Refined Obsidian',24],['Teleportation Core',5],['Infused Alloy',38],['Basic Circuit',6],['Basic Alloy',4],['Basic Chemical Tank',6],['Steel Casing',3],['Blei',6],['Osmiumstaub',15],['Glas',30]],
  rawTitle:'Hauptbauteile gesamt', rawNote:'Ohne die Zwischenstufen der Tanks und Kabel (Elite Tank, Elite Cable).'},

  {id:'upgrades',title:'Upgrades und Durchsatz',html:"<p class=\"lead\">Mit diesen Speed-Upgrades schafft die Kette ca. <b>16 mB/t</b>. Das ist mehr, als dein Reaktor verbrennen kann (Turbine heute ca. 9,6 mB/t, Reaktor max. 12 mB/t). Energy-Upgrades sind freiwillig, sie senken nur den Stromverbrauch.</p>\n  <div class=\"card tw\"><table class=\"t\">\n    <tr><th>Maschine</th><th>Speed</th><th>Takt</th><th>reicht für Fissile Fuel</th></tr>\n    <tr><td>Enrichment Chamber</td><td class=\"n\">4</td><td>63 Ticks pro Barren (sonst 200)</td><td class=\"n\">15,9 mB/t</td></tr>\n    <tr><td>Chemical Oxidizer</td><td class=\"n\">4</td><td>31 Ticks pro Yellow Cake (sonst 100)</td><td class=\"n\">16,1 mB/t</td></tr>\n    <tr><td>Chemical Dissolution Chamber</td><td class=\"n\">0</td><td>100 Ticks pro Fluorit</td><td class=\"n\">20 mB/t</td></tr>\n    <tr><td>Chemical Infuser</td><td class=\"n\">3</td><td>8 Vorgänge pro Tick (sonst 1)</td><td class=\"n\">16 mB/t</td></tr>\n    <tr><td>Isotopic Centrifuge</td><td class=\"n\">4</td><td>16 Vorgänge pro Tick (sonst 1)</td><td class=\"n\">16 mB/t</td></tr>\n  </table></div>\n  <div class=\"muted\" style=\"font-size:13px;margin-top:6px\">Formeln aus dem Code: Ticks = Grundzeit × 10^(−Speed/8). Bei Infuser und Centrifuge verdoppelt jedes Speed-Upgrade die Vorgänge pro Tick. Ohne Upgrades schafft die Centrifuge nur <b>1 mB/t</b>.</div>\n  <div class=\"grid2\" style=\"margin-top:14px\">\n    <div class=\"card\"><h3>Bedarf bei 10 mB/t</h3><table class=\"t\">\n      <tr><td>Uran-Barren</td><td class=\"n\">12 / min · 720 / h</td></tr>\n      <tr><td>= Uran-Erz durch die Erzverarbeitung (1 Erz → 2 Barren)</td><td class=\"n\">360 / h</td></tr>\n      <tr><td>Fluorit</td><td class=\"n\">6 / min · 360 / h</td></tr>\n      <tr><td>Schwefelstaub</td><td class=\"n\">3 / min · 180 / h</td></tr>\n    </table></div>\n    <div class=\"card\"><h3>Woher die Rohstoffe kommen</h3><table class=\"t\">\n      <tr><td>Uran</td><td>Uran-Erz durch deine Erzverarbeitung, oder T4-Void-Miner mit Metallic-Ore-Linse</td></tr>\n      <tr><td>Fluorit</td><td>Fluorit-Erz (Oberwelt) → Enrichment Chamber → 6 Fluorit</td></tr>\n      <tr><td>Schwefel</td><td>Mystical Agriculture: 3 Sulfur Essence → 8 Staub (am einfachsten). Oder IE-Crusher mit Blaze Rods (50 % Schwefel nebenbei).</td></tr>\n    </table></div>\n  </div>"},
  {id:'reaktor',title:'Reaktor-Seite (Netherdach)',html:"<p class=\"lead\">Am Kraftwerk kommt alles über den Entangloporter vor dem Input-Port an. Brennstoff (Gas) und Wasser (Flüssigkeit) laufen auf <b>derselben Frequenz</b>, sie stören sich nicht.</p>\n  <div class=\"grid2\">\n    <div class=\"card\"><h3>QE „Brennstoff“ · 1303 / 130 / −240</h3><table class=\"t\">\n      <tr><td>Frequenz</td><td><b>Brennstoff</b>, privat</td></tr>\n      <tr><td>Gase</td><td>Südseite (zum Port 1303 / 130 / −239) = <b>Output</b>, Auto-Eject an</td></tr>\n      <tr><td>Flüssigkeiten</td><td>Südseite = <b>Output</b>, Auto-Eject an</td></tr>\n    </table></div>\n    <div class=\"card\"><h3>QE „Müll“ · 1305 / 130 / −240</h3><table class=\"t\">\n      <tr><td>Frequenz</td><td><b>Müll</b>, privat</td></tr>\n      <tr><td>Gase</td><td>Südseite (zum Port 1305 / 130 / −239, Modus Output Waste) = <b>Input</b></td></tr>\n    </table></div>\n  </div>\n  <div class=\"ok\">Der Wasser-Kreislauf läuft im Betrieb von selbst: Die Condensers der Turbine geben Wasser über das Ventil 1299 / 130 / −237 zurück in den Port 1300 / 130 / −237. Wasser brauchst du nur einmal zum Befüllen.</div>"},
  {id:'muell',title:'Atommüll',html:"<div class=\"card\">\n    <p style=\"margin-top:0\">Der Reaktor macht pro mB Brennstoff 1 mB <b>Nuclear Waste</b>, bei 10 mB/t also 720.000 mB pro Stunde. Der Müll-Tank (Ultimate Chemical Tank, 8.192.000 mB) ist nach ca. <b>11 Stunden</b> voll.</p>\n    <div class=\"warn\"><b>Ist der Müll-Tank voll,</b> füllt sich der Müll-Tank im Reaktor. Dann löst dein Logic Adapter <b>Excess Waste</b> den Not-Aus aus. Das ist gewollt, aber das Kraftwerk steht dann. Leere den Tank vorher oder baue die Weiterverarbeitung:</div>\n    <table class=\"t\" style=\"margin-top:10px\">\n      <tr><td>Plutonium</td><td>Isotopic Centrifuge: 10 mB Nuclear Waste → 1 mB Plutonium</td></tr>\n      <tr><td>Polonium (für die Fusion)</td><td>Solar Neutron Activator: 10 mB Nuclear Waste → 1 mB Polonium (braucht Tageslicht)</td></tr>\n    </table>\n    <div class=\"warn\"><b>Strahlung:</b> Tanks und QEs mit Müll nie gefüllt abbauen. Sonst wird die Strahlung frei. Beim Umbauen Hazmat-Anzug tragen.</div>\n  </div><div class=\"ok\"><b>Recycling:</b> Die <a href=\"../recycling/\">Recycling-Anlage</a> macht aus dem Müll wieder ca. 80 % des Brennstoffs.</div>"},
