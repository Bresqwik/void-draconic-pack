# Void & Draconic: nur die abweichenden Werte, Forge ergänzt den Rest beim Start.
# Speicherseite gehört BAS (C2ME: ioSystem.async/replaceImpl aus, autoSave VANILLA).

[levelData]
	# Forge-Registry-Tabelle (3,5 MB der level.dat) zwischenspeichern statt alle 5 Min. neu bauen
	cacheRegistrySnapshot = true
	# Prüfmodus 1 lief 08.–20.10.2026 ohne MISMATCH → Standard 12 (1 geprüfter Neubau pro Stunde)
	registryCacheRevalidateCycles = 12

[playerData]
	# Spielerdaten nicht alle im selben Tick schreiben, sondern 1 Spieler pro Tick
	staggerMaxPerTick = 1
