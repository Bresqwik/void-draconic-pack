# MiniMOTD – Void & Draconic
# Ein fester Eintrag (kein Zufall mehr). Zeile 2 aktualisiert der Dashboard-Sammler auf dem Server live.
# Format: https://docs.papermc.io/adventure/minimessage/format/
icon-enabled=true
motd-enabled=true
motds=[
    {
        # Ein fester Eintrag: gleiches Icon und gleicher Titel bei jedem Aktualisieren.
        # Zeile 2 schreibt der Dashboard-Sammler auf dem Server jede Minute neu (Status, TPS, Weltgenerierung).
        # <obfuscated> flackert im Client dauerhaft: die einzige echte Animation in der Serverliste.
        icon="drachenfluegel"
        line1="           <#9B5DE5><obfuscated>::</obfuscated></#9B5DE5> <gradient:#9B5DE5:#C77DFF:#FF6A2B><bold>✦ VOID & DRACONIC ✦</bold></gradient> <#FF6A2B><obfuscated>::</obfuscated></#FF6A2B>"
        line2="          <#46C35B>● <white><online_players><gray>/<max_players> online <dark_gray>• <#3FD0E0>Botania · Mekanism · Create <dark_gray>• <#F5D547>1.20.1"
    }
]
player-count-settings {
    allow-exceeding-maximum=false
    disable-player-list-hover=false
    fake-players {
        fake-players="25%"
        fake-players-enabled=false
    }
    hide-player-count=false
    just-x-more-settings {
        just-x-more-enabled=false
        x-value=3
    }
    max-players=6
    max-players-enabled=false
    servers=[]
}
